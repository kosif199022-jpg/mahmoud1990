<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7659ef">
  <meta name="description" content="Kosif — منصة المراجعة ومكتبة المعايير">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Kosif — تمحيص | حسابات ٢</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f7f6fb;color:#27304a;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
    #boot{max-width:560px;margin:18vh auto;padding:26px;text-align:center}.logo{font:700 42px Georgia,"Times New Roman",serif;background:linear-gradient(90deg,#7659ef,#d85abc);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}.mut{color:#858da1;line-height:1.7}.bar{height:8px;border-radius:99px;background:#e8e4f3;overflow:hidden;margin:18px 0}.bar i{display:block;height:100%;width:4%;background:linear-gradient(90deg,#7659ef,#d85abc);transition:.2s}.err{white-space:pre-wrap;direction:rtl;text-align:right;padding:18px;border:1px solid #eaddea;border-radius:16px;background:#fff}
  </style>
</head>
<body>
  <main id="boot"><div class="logo">Kosif</div><div class="mut" id="bootText">جارٍ تجهيز التطبيق…</div><div class="bar"><i id="bootBar"></i></div></main>
  <script>
  (async()=>{
    const files=['p01.txt','p02.txt','p03.txt','p04.txt','p05a.txt','p05b.txt','p05c.txt','p05d.txt','p06.txt'];
    const text=document.getElementById('bootText'),bar=document.getElementById('bootBar');
    try{
      let done=0;const parts=await Promise.all(files.map(async f=>{const r=await fetch(`parts/${f}`,{cache:'default'});if(!r.ok)throw new Error(`تعذر تحميل ${f}`);const v=await r.text();done++;bar.style.width=`${Math.round(done/files.length*78)}%`;text.textContent=`جارٍ تحميل Kosif… ${done}/${files.length}`;return v}));
      const bin=atob(parts.join('')),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      if(!('DecompressionStream'in window))throw new Error('المتصفح قديم ولا يدعم فك حزمة التطبيق. حدّث المتصفح ثم أعد المحاولة.');
      text.textContent='جارٍ تشغيل التطبيق…';bar.style.width='88%';
      const ds=new DecompressionStream('gzip'),html=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();
      const extra='<link rel="stylesheet" href="./theme-restore.css?v=1.0.0"><script src="./standards/bridge.js?v=2.0.0"><'+'/script><script src="./standards/nav-fix.js?v=2.0.0"><'+'/script><script src="./theme-restore.js?v=1.0.0"><'+'/script><script>if(\'serviceWorker\' in navigator){navigator.serviceWorker.register(\'./sw.js\').catch(()=>{})}<'+'/script>';
      const patched=html.replace(/<\/body>/i,extra+'</body>');bar.style.width='100%';document.open();document.write(patched);document.close();
    }catch(e){console.error(e);document.getElementById('boot').innerHTML=`<div class="logo">Kosif</div><div class="err"><b>تعذر تشغيل التطبيق.</b><br><br>${String(e.message||e)}<br><br><button onclick="location.reload()">إعادة المحاولة</button> &nbsp; <a href="./standards/">فتح مكتبة المعايير</a></div>`}
  })();
  </script>
</body>
</html>
