name: Build Kosif v36 Recovered Core

on:
  push:
    branches: [v36-consolidated]
    paths: ['.github/workflows/build-v36-recovered-core.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v36-consolidated
          fetch-depth: 1
      - name: Reconstruct stable self-contained application and extract core
        shell: bash
        run: |
          set -euo pipefail
          OLD=e3d1d8b5751beb2b16a40a7e4ae08164cc858a4e
          git fetch origin "$OLD" --depth=1
          : > /tmp/app.b64
          for f in p01.txt p02.txt p03.txt p04.txt p05a.txt p05b.txt p05c.txt p05d.txt p06.txt; do
            git show "$OLD:parts/$f" >> /tmp/app.b64
          done
          base64 -d /tmp/app.b64 | gzip -dc > /tmp/pre-v35.html
          mkdir -p public/legacy
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('/tmp/pre-v35.html').read_text(encoding='utf8')
          scripts=re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',s,re.I)
          assert len(scripts)==2, f'expected 2 inline scripts, got {len(scripts)}'
          # The first script is the deterministic/core audit engine; the second is the old app bootstrap/UI extension.
          out='/* KOSIF_V36_RECOVERED_CORE — recovered from stable packed app '+"e3d1d8b"+' */\n'+scripts[0]+'\n\n'+scripts[1]+'\n'
          pathlib.Path('public/legacy/core-v36.js').write_text(out,encoding='utf8')
          print('CORE_BYTES',len(out.encode()))
          for t in ['function go','function refreshAll','function renderOutputs','function callGemini','function fileToParts','function runNextRound','function renderMap','function applyDemo']:
              assert t in out, 'missing '+t
              print('FOUND',t)
          PY
          node --check public/legacy/core-v36.js
      - name: Patch frontend to use recovered core and remove dead legacy files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('frontend/index.html'); s=p.read_text(encoding='utf8')
          s=re.sub(r'\s*<script src="/legacy/engine\.js\?v=20"></script>\s*<script src="/legacy/appjs\.js\?v=20"></script>\s*<script src="/legacy/v5js\.js\?v=20"></script>', '\n<script src="/legacy/core-v36.js?v=36"></script>\n', s, flags=re.I)
          s=re.sub(r'\s*<script src="/legacy/tamhees-v6-patch\.js\?v=20"></script>', '\n', s, flags=re.I)
          assert '/legacy/engine.js' not in s and '/legacy/appjs.js' not in s and '/legacy/v5js.js' not in s and 'tamhees-v6-patch.js' not in s
          assert '/legacy/core-v36.js?v=36' in s
          p.write_text(s,encoding='utf8')
          Path('public/index.html').write_text(s,encoding='utf8')
          PY
      - name: Validate zero missing static refs and JS syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check public/legacy/core-v36.js
          node --check public/standards/bridge.js
          node --check public/sw.js
          python3 - <<'PY'
          import re, pathlib, os
          s=pathlib.Path('public/index.html').read_text()
          refs=re.findall(r'<(?:script|link)\b[^>]*(?:src|href)=["\']([^"\']+)',s,re.I)
          missing=[]
          for u in refs:
              if not u.startswith('/'): continue
              clean=u.split('?')[0].split('#')[0]
              if clean=='/' or clean.startswith('/api/'): continue
              fp='public'+clean
              if not os.path.exists(fp): missing.append(clean)
          print('MISSING',missing)
          assert not missing, missing
          ids=re.findall(r'\bid=["\']([^"\']+)',s)
          dup=sorted({x for x in ids if ids.count(x)>1})
          print('DUP_IDS',dup)
          assert not dup, dup
          PY
      - name: Commit recovered core candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/legacy/core-v36.js frontend/index.html public/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Restore deterministic audit core for Kosif v36'
          git push origin HEAD:v36-consolidated
