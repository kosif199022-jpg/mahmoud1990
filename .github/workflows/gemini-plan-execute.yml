name: '🧙 Gemini Plan Execution'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

concurrency:
  group: '${{ github.workflow }}-plan-execute-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  plan-execute:
    timeout-minutes: 45
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Checkout Code'
        uses: 'actions/checkout@v4'
        with:
          persist-credentials: 'false'
          fetch-depth: 1

      - name: 'Prepare prompt context'
        shell: 'bash'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
          TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          DESCRIPTION: '${{ github.event.pull_request.body || github.event.issue.body }}'
          EVENT_NAME: '${{ github.event_name }}'
          IS_PULL_REQUEST: '${{ !!github.event.pull_request }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
        run: |-
          set -euo pipefail

          comments_file="$(mktemp)"
          trap 'rm -f "${comments_file}"' EXIT

          if [[ -n "${ISSUE_NUMBER}" ]]; then
            gh api "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" > "${comments_file}"
          else
            printf '[]' > "${comments_file}"
          fi

          latest_plan="$(jq -r '[.[] | select((.body // "") | contains("AI Assistant: Plan of Action"))] | last | .body // ""' "${comments_file}")"

          jq -n \
            --arg title "${TITLE}" \
            --arg desc "${DESCRIPTION}" \
            --arg event "${EVENT_NAME}" \
            --arg pr "${IS_PULL_REQUEST}" \
            --arg num "${ISSUE_NUMBER}" \
            --arg repo "${REPOSITORY}" \
            --arg context "${ADDITIONAL_CONTEXT}" \
            --arg latest_plan "${latest_plan}" \
            '{title: $title, description: $desc, event_name: $event, is_pull_request: $pr, issue_number: $num, repository: $repo, additional_context: $context, latest_plan: $latest_plan}' > gemini-context.json

          if [[ -z "${latest_plan//[[:space:]]/}" ]]; then
            echo "No substantive AI Assistant plan was found in Issue comments." >&2
            exit 1
          fi

      - name: 'Run Gemini CLI'
        id: 'run_gemini'
        uses: 'google-github-actions/run-gemini-cli@v0'
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: '0.40.0'
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: 'gemini-3-flash-preview'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-plan-execute'
          github_pr_number: '${{ github.event.pull_request.number }}'
          github_issue_number: '${{ github.event.issue.number }}'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 120
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "tools": {
                "core": [
                  "read_file",
                  "read_many_files",
                  "glob",
                  "grep_search",
                  "list_directory",
                  "write_file",
                  "replace"
                ]
              }
            }
          prompt: |-
            You are the approved implementation agent for this GitHub repository.

            First read `GEMINI.md` and `gemini-context.json` with `read_file`.

            `gemini-context.json` is generated by the workflow and is authoritative for this run. It contains the repository, Issue number, original Issue description, explicit approval context, and the latest approved `AI Assistant: Plan of Action` in `latest_plan`.

            If `latest_plan` is empty, or `additional_context` does not clearly confirm owner approval, stop without modifying application files and explain why.

            Otherwise implement only the first coherent high-priority phase of the approved plan. Do not attempt the entire application in one run.

            Mandatory implementation rules:
            - Work only in the local checked-out working tree.
            - Do NOT create a Git branch, commit, remote write, Issue comment, or Pull Request yourself. The GitHub Actions workflow will validate and publish your local changes after you finish.
            - Do NOT run shell commands or probe unavailable tools. Validation is performed by the workflow after your edits.
            - Never modify, delete, commit, or include `gemini-context.json`, `.gemini/`, credentials, logs, secrets, or private user data.
            - Preserve existing valuable functionality and avoid unrelated rewrites.
            - Keep deterministic accounting calculations deterministic; do not replace them with AI guesses.
            - Preserve Arabic-first RTL behavior and mobile/iPhone behavior unless the approved phase explicitly improves them.
            - Make concrete code changes using `write_file` and `replace` only where supported by repository evidence.
            - If a safe implementation is not possible, make no speculative changes and clearly report the blocker.

            Return a concise final execution summary with:
            - implemented phase
            - files changed
            - key changes
            - tests that the workflow should run
            - remaining phases
            - unresolved risks or blockers

      - name: 'Remove generated agent files'
        if: ${{ steps.run_gemini.outcome == 'success' }}
        run: |-
          set -euo pipefail
          rm -f gemini-context.json
          rm -rf gemini-artifacts

      - name: 'Detect implementation changes'
        id: 'changes'
        if: ${{ steps.run_gemini.outcome == 'success' }}
        run: |-
          set -euo pipefail
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -z "${status}" ]]; then
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
            echo "Gemini completed but produced no repository changes."
          else
            echo "has_changes=true" >> "${GITHUB_OUTPUT}"
            echo "Repository changes detected:"
            printf '%s\n' "${status}"
          fi

      - name: 'Validate implementation changes'
        id: 'validate'
        if: ${{ steps.changes.outputs.has_changes == 'true' }}
        run: |-
          set -euo pipefail
          git diff --check
          npm run build
          npm run check

      - name: 'Publish implementation branch and Pull Request'
        id: 'publish'
        if: ${{ steps.changes.outputs.has_changes == 'true' && steps.validate.outcome == 'success' }}
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          GEMINI_RESPONSE: '${{ steps.run_gemini.outputs.summary }}'
        run: |-
          set -euo pipefail

          branch="gemini/issue-${ISSUE_NUMBER}-run-${GITHUB_RUN_ID}"

          rm -f gemini-context.json
          rm -rf gemini-artifacts

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "has_published_changes=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git commit -m "feat: implement approved Gemini phase for issue #${ISSUE_NUMBER}"

          # Use GitHub CLI's credential helper only inside this ephemeral runner.
          # Checkout still keeps persist-credentials=false, and no token is written to the repository.
          gh auth setup-git
          git push origin "HEAD:refs/heads/${branch}"

          body_file="$(mktemp)"
          trap 'rm -f "${body_file}"' EXIT
          {
            echo "Implements the approved Gemini development phase from #${ISSUE_NUMBER}."
            echo
            echo "Validation executed by GitHub Actions before publication:"
            echo "- git diff --check"
            echo "- npm run build"
            echo "- npm run check"
            echo
            echo "The PR is intentionally not auto-merged and requires human review."
            if [[ -n "${GEMINI_RESPONSE//[[:space:]]/}" ]]; then
              echo
              echo "Gemini implementation summary:"
              echo
              printf '%s\n' "${GEMINI_RESPONSE}"
            fi
          } > "${body_file}"

          pr_url=""
          if pr_url="$(gh pr create --repo "${REPOSITORY}" --base main --head "${branch}" --title "feat: approved Gemini implementation for #${ISSUE_NUMBER}" --body-file "${body_file}")"; then
            echo "pr_url=${pr_url}" >> "${GITHUB_OUTPUT}"
            echo "pr_number=${pr_url##*/}" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::The branch was published, but GitHub Actions could not create the Pull Request."
          fi

          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
          echo "has_published_changes=true" >> "${GITHUB_OUTPUT}"

      - name: 'Publish Gemini execution result'
        if: ${{ always() }}
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          GEMINI_RESPONSE: '${{ steps.run_gemini.outputs.summary }}'
          GEMINI_OUTCOME: '${{ steps.run_gemini.outcome }}'
          HAS_CHANGES: '${{ steps.changes.outputs.has_changes }}'
          VALIDATION_OUTCOME: '${{ steps.validate.outcome }}'
          PUBLISH_OUTCOME: '${{ steps.publish.outcome }}'
          BRANCH: '${{ steps.publish.outputs.branch }}'
          PR_URL: '${{ steps.publish.outputs.pr_url }}'
        run: |-
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "${tmp}"' EXIT

          if [[ "${GEMINI_OUTCOME}" != "success" ]]; then
            cat > "${tmp}" <<'EOF'
          ❌ Gemini execution failed before a validated application change could be published. No implementation should be treated as complete.
          EOF
          elif [[ "${HAS_CHANGES}" != "true" ]]; then
            cat > "${tmp}" <<'EOF'
          ⚠️ Gemini completed successfully but produced no repository changes, so no implementation branch or Pull Request was created.
          EOF
          elif [[ "${VALIDATION_OUTCOME}" != "success" ]]; then
            cat > "${tmp}" <<'EOF'
          ❌ Gemini changed application files, but deterministic workflow validation failed. The changes were not pushed and no Pull Request was created.
          EOF
          elif [[ -n "${PR_URL}" ]]; then
            {
              echo "✅ Gemini implementation was validated and published for review."
              echo
              echo "Branch: \`${BRANCH}\`"
              echo "Pull Request: ${PR_URL}"
              echo
              echo "Validation passed: \`git diff --check\`, \`npm run build\`, and \`npm run check\`."
              if [[ -n "${GEMINI_RESPONSE//[[:space:]]/}" ]]; then
                echo
                echo "### Gemini implementation summary"
                echo
                printf '%s\n' "${GEMINI_RESPONSE}"
              fi
            } > "${tmp}"
          elif [[ "${PUBLISH_OUTCOME}" == "success" && -n "${BRANCH}" ]]; then
            {
              echo "⚠️ Gemini implementation passed validation and was pushed to branch \`${BRANCH}\`, but automatic Pull Request creation was not permitted."
              echo "The branch is preserved and can be opened as a Pull Request manually or by the repository integration."
            } > "${tmp}"
          else
            cat > "${tmp}" <<'EOF'
          ❌ Gemini changes passed validation, but publication failed before a reviewable Pull Request was available. Main was not modified.
          EOF
          fi

          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body-file "${tmp}"
