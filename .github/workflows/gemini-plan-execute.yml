name: '🧙 Gemini Plan Execution'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

concurrency:
  group: '${{ github.workflow }}-plan-execute-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  plan-execute:
    timeout-minutes: 60
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Checkout Code'
        uses: 'actions/checkout@v4'
        with:
          persist-credentials: 'false'
          fetch-depth: 1

      - name: 'Prepare prompt context'
        shell: 'bash'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
          TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          DESCRIPTION: '${{ github.event.pull_request.body || github.event.issue.body }}'
          EVENT_NAME: '${{ github.event_name }}'
          IS_PULL_REQUEST: '${{ !!github.event.pull_request }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
        run: |-
          set -euo pipefail

          comments_file="$(mktemp)"
          trap 'rm -f "${comments_file}"' EXIT

          if [[ -n "${ISSUE_NUMBER}" ]]; then
            gh api "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" > "${comments_file}"
          else
            printf '[]' > "${comments_file}"
          fi

          approved_plan_id="$(jq -r '
            [
              .[]
              | select((.body // "") | test("gemini-approved-plan:[0-9]+"))
              | ((.body // "") | capture("gemini-approved-plan:(?<id>[0-9]+)").id)
            ]
            | last // ""
          ' "${comments_file}")"

          if [[ -n "${approved_plan_id}" ]]; then
            plan_comment="$(jq -c --arg id "${approved_plan_id}" '
              [.[] | select((.id | tostring) == $id)] | last // {}
            ' "${comments_file}")"
          else
            plan_comment="$(jq -c '
              [
                .[]
                | select((.body // "") | contains("AI Assistant: Plan of Action"))
                | select((((.body // "") | contains("Request clarification"))) | not)
                | select((((.body // "") | contains("context is empty"))) | not)
                | select((((.body // "") | contains("Model verification"))) | not)
                | select((((.body // "") | contains("Core Version Alignment"))) | not)
                | select(((.body // "") | length) > 2500)
              ]
              | last // {}
            ' "${comments_file}")"
          fi

          latest_plan="$(jq -r '.body // ""' <<< "${plan_comment}")"
          latest_plan_id="$(jq -r '.id // ""' <<< "${plan_comment}")"

          if [[ -z "${latest_plan//[[:space:]]/}" ]] || ! grep -q 'AI Assistant: Plan of Action' <<< "${latest_plan}"; then
            echo "No valid substantive AI Assistant development plan was selected." >&2
            exit 1
          fi

          if [[ ${#latest_plan} -lt 2500 ]]; then
            echo "Selected plan is too short to be treated as the approved full development plan." >&2
            exit 1
          fi

          phase_comment="$(jq -c '
            [
              .[]
              | select((.body // "") | contains("gemini-phase-directive:"))
            ]
            | last // {}
          ' "${comments_file}")"
          phase_directive="$(jq -r '.body // ""' <<< "${phase_comment}")"
          phase_directive_id="$(jq -r '.id // ""' <<< "${phase_comment}")"

          if [[ -z "${phase_directive//[[:space:]]/}" ]]; then
            phase_directive='gemini-phase-directive: PHASE 1A — Critical State & DOM Sync. Audit and fix state-to-UI synchronization in public/v36-features.js, specifically renderTB(), renderAnalytics(), and renderPBC(), their state mutation callers, persistence restore paths, and render triggering. Eliminate stale UI, missed renders, duplicate renders, and race-prone sequencing without changing deterministic accounting logic. Do not perform release/version/cache alignment in this phase.'
            phase_directive_id='workflow-default-phase-1A'
          fi

          echo "Selected Gemini development plan comment: ${latest_plan_id}"
          echo "Selected Gemini phase directive: ${phase_directive_id}"

          jq -n \
            --arg title "${TITLE}" \
            --arg desc "${DESCRIPTION}" \
            --arg event "${EVENT_NAME}" \
            --arg pr "${IS_PULL_REQUEST}" \
            --arg num "${ISSUE_NUMBER}" \
            --arg repo "${REPOSITORY}" \
            --arg context "${ADDITIONAL_CONTEXT}" \
            --arg latest_plan "${latest_plan}" \
            --arg latest_plan_comment_id "${latest_plan_id}" \
            --arg phase_directive "${phase_directive}" \
            --arg phase_directive_comment_id "${phase_directive_id}" \
            '{title: $title, description: $desc, event_name: $event, is_pull_request: $pr, issue_number: $num, repository: $repo, additional_context: $context, latest_plan: $latest_plan, latest_plan_comment_id: $latest_plan_comment_id, phase_directive: $phase_directive, phase_directive_comment_id: $phase_directive_comment_id}' > gemini-context.json

      - name: 'Run Gemini CLI'
        id: 'run_gemini'
        uses: 'google-github-actions/run-gemini-cli@v0'
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: '0.40.0'
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: 'gemini-3-flash-preview'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-plan-execute'
          github_pr_number: '${{ github.event.pull_request.number }}'
          github_issue_number: '${{ github.event.issue.number }}'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 120
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "tools": {
                "core": [
                  "read_file",
                  "read_many_files",
                  "glob",
                  "grep_search",
                  "list_directory",
                  "write_file",
                  "replace"
                ]
              }
            }
          prompt: |-
            You are the approved implementation agent for this GitHub repository.

            First read `GEMINI.md` and `gemini-context.json` with `read_file`.

            The context file is authoritative. Execute ONLY the exact `phase_directive` from the explicitly selected substantive plan. Do not substitute a different phase.

            For the current Phase 1A directive, the intended product work is Critical State & DOM Sync, centered on `public/v36-features.js`, especially `renderTB()`, `renderAnalytics()`, `renderPBC()`, their state-mutation callers, persistence restore paths, and render scheduling/triggering.

            This is NOT a release/version alignment task. In this phase you MUST NOT mechanically bump versions, cache-busting query strings, service-worker cache generations, release headers, worker build identities, schema versions, or historical loader identifiers. Do not touch those areas unless the phase directive explicitly changes in a future run.

            Before editing:
            - Inspect `public/v36-features.js` and only the directly relevant callers/helpers.
            - Inspect `package.json` and relevant regression/contract scripts in `scripts/`.
            - Treat regression tests, historical compatibility identifiers, accounting invariants, security gates, and mobile/iPhone contracts as hard requirements.

            Phase 1A acceptance criteria:
            - State mutations that affect Trial Balance, analytics, or PBC reliably produce the correct UI refresh.
            - Avoid missed renders, stale views, duplicate render storms, and race-prone sequencing.
            - Preserve localStorage/persistence behavior and history restoration contracts.
            - Preserve deterministic Trial Balance, Benford, reconciliation, and audit calculations exactly; never replace them with AI inference.
            - Preserve Arabic-first RTL and mobile/iPhone behavior.
            - Prefer the smallest coherent fix. Change other application files only when required by direct evidence.
            - Do not modify workflows, tests, release contracts, version strings, cache generations, or schemas in this product phase.

            Mandatory rules:
            - Work only in the local checked-out working tree.
            - Do NOT create Git branches, commits, remote writes, Issue comments, or Pull Requests yourself. The workflow publishes validated local changes.
            - Do NOT run shell commands. Validation is performed by the workflow.
            - Never modify or include `gemini-context.json`, `.gemini/`, credentials, logs, secrets, or private data.
            - Never weaken/remove/bypass tests merely to pass validation.
            - Preserve existing valuable functionality and avoid unrelated rewrites.
            - If evidence does not justify a safe change, do not speculate.

            Return a concise summary containing the selected plan comment ID, phase directive ID, files changed, exact behavior fixed, remaining risks, and next recommended phase.

      - name: 'Remove generated agent files'
        if: ${{ steps.run_gemini.outcome == 'success' }}
        run: |-
          set -euo pipefail
          rm -f gemini-context.json
          rm -rf gemini-artifacts

      - name: 'Detect implementation changes'
        id: 'changes'
        if: ${{ steps.run_gemini.outcome == 'success' }}
        run: |-
          set -euo pipefail
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -z "${status}" ]]; then
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
            echo "Gemini completed but produced no repository changes."
          else
            echo "has_changes=true" >> "${GITHUB_OUTPUT}"
            echo "Repository changes detected:"
            printf '%s\n' "${status}"
          fi

      - name: 'Initial deterministic validation'
        id: 'validate_initial'
        if: ${{ steps.changes.outputs.has_changes == 'true' }}
        run: |-
          set -u
          : > gemini-validation.log
          git status --porcelain --untracked-files=all > gemini-changed-files.txt

          diff_code=0
          build_code=0
          check_code=0

          git diff --check >> gemini-validation.log 2>&1 || diff_code=$?
          npm run build >> gemini-validation.log 2>&1 || build_code=$?
          npm run check >> gemini-validation.log 2>&1 || check_code=$?

          cat gemini-validation.log

          if [[ ${diff_code} -eq 0 && ${build_code} -eq 0 && ${check_code} -eq 0 ]]; then
            echo "passed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "passed=false" >> "${GITHUB_OUTPUT}"
            echo "diff_code=${diff_code}" >> "${GITHUB_OUTPUT}"
            echo "build_code=${build_code}" >> "${GITHUB_OUTPUT}"
            echo "check_code=${check_code}" >> "${GITHUB_OUTPUT}"
          fi
          exit 0

      - name: 'Repair Gemini changes after failed validation'
        id: 'repair_gemini'
        if: ${{ steps.changes.outputs.has_changes == 'true' && steps.validate_initial.outputs.passed == 'false' }}
        uses: 'google-github-actions/run-gemini-cli@v0'
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: '0.40.0'
          gemini_debug: 'false'
          gemini_model: 'gemini-3-flash-preview'
          upload_artifacts: 'false'
          workflow_name: 'gemini-plan-execute-repair'
          github_issue_number: '${{ github.event.issue.number }}'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 60
              },
              "telemetry": {
                "enabled": false
              },
              "tools": {
                "core": [
                  "read_file",
                  "read_many_files",
                  "glob",
                  "grep_search",
                  "list_directory",
                  "write_file",
                  "replace"
                ]
              }
            }
          prompt: |-
            This is a repair pass for YOUR current local implementation, not a new feature phase.

            Read `gemini-validation.log` and `gemini-changed-files.txt`, then inspect only the application files implicated by the validation failure and your current edits.

            Fix the implementation so the existing repository contracts pass WITHOUT modifying tests, `.github/workflows/`, version identifiers, cache generations, schema versions, release identities, historical compatibility identifiers, generated context, secrets, or logs.

            Preserve the approved Phase 1A goal: Critical State & DOM Sync for Trial Balance, analytics, and PBC. If any previous edit drifted into release/version/cache alignment, revert that drift in the application files and keep only justified Phase 1A product changes.

            Do not run shell commands. Do not create commits, branches, comments, or PRs. The workflow will validate again.

            Return a short repair summary.

      - name: 'Remove repair artifacts'
        if: ${{ steps.changes.outputs.has_changes == 'true' }}
        run: |-
          set -euo pipefail
          rm -f gemini-validation.log gemini-changed-files.txt gemini-context.json
          rm -rf gemini-artifacts .gemini

      - name: 'Final deterministic validation'
        id: 'validate'
        if: ${{ steps.changes.outputs.has_changes == 'true' }}
        run: |-
          set -euo pipefail
          git diff --check
          npm run build
          npm run check

      - name: 'Publish implementation branch and Pull Request'
        id: 'publish'
        if: ${{ steps.changes.outputs.has_changes == 'true' && steps.validate.outcome == 'success' }}
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          GEMINI_RESPONSE: '${{ steps.run_gemini.outputs.summary }}'
          REPAIR_RESPONSE: '${{ steps.repair_gemini.outputs.summary }}'
        run: |-
          set -euo pipefail

          branch="gemini/issue-${ISSUE_NUMBER}-run-${GITHUB_RUN_ID}"

          rm -f gemini-context.json gemini-validation.log gemini-changed-files.txt
          rm -rf gemini-artifacts .gemini

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "has_published_changes=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git commit -m "feat: implement approved Gemini phase for issue #${ISSUE_NUMBER}"

          gh auth setup-git
          git push origin "HEAD:refs/heads/${branch}"

          body_file="$(mktemp)"
          trap 'rm -f "${body_file}"' EXIT
          {
            echo "Implements the explicitly selected approved Gemini development phase from #${ISSUE_NUMBER}."
            echo
            echo "Validation passed before publication:"
            echo "- git diff --check"
            echo "- npm run build"
            echo "- npm run check"
            echo
            echo "The PR is intentionally not auto-merged and requires human review."
            if [[ -n "${GEMINI_RESPONSE//[[:space:]]/}" ]]; then
              echo
              echo "### Gemini implementation summary"
              printf '%s\n' "${GEMINI_RESPONSE}"
            fi
            if [[ -n "${REPAIR_RESPONSE//[[:space:]]/}" ]]; then
              echo
              echo "### Automatic validation-repair summary"
              printf '%s\n' "${REPAIR_RESPONSE}"
            fi
          } > "${body_file}"

          pr_url=""
          if pr_url="$(gh pr create --repo "${REPOSITORY}" --base main --head "${branch}" --title "feat: approved Gemini implementation for #${ISSUE_NUMBER}" --body-file "${body_file}")"; then
            echo "pr_url=${pr_url}" >> "${GITHUB_OUTPUT}"
            echo "pr_number=${pr_url##*/}" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::The branch was published, but GitHub Actions could not create the Pull Request."
          fi

          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
          echo "has_published_changes=true" >> "${GITHUB_OUTPUT}"

      - name: 'Publish Gemini execution result'
        if: ${{ always() }}
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          GEMINI_RESPONSE: '${{ steps.run_gemini.outputs.summary }}'
          REPAIR_RESPONSE: '${{ steps.repair_gemini.outputs.summary }}'
          GEMINI_OUTCOME: '${{ steps.run_gemini.outcome }}'
          HAS_CHANGES: '${{ steps.changes.outputs.has_changes }}'
          INITIAL_PASSED: '${{ steps.validate_initial.outputs.passed }}'
          VALIDATION_OUTCOME: '${{ steps.validate.outcome }}'
          PUBLISH_OUTCOME: '${{ steps.publish.outcome }}'
          BRANCH: '${{ steps.publish.outputs.branch }}'
          PR_URL: '${{ steps.publish.outputs.pr_url }}'
        run: |-
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "${tmp}"' EXIT

          if [[ "${GEMINI_OUTCOME}" != "success" ]]; then
            echo "❌ Gemini execution failed before a validated application change could be published." > "${tmp}"
          elif [[ "${HAS_CHANGES}" != "true" ]]; then
            echo "⚠️ Gemini completed but produced no repository changes, so no implementation PR was created." > "${tmp}"
          elif [[ "${VALIDATION_OUTCOME}" != "success" ]]; then
            {
              echo "❌ Gemini changed application files, and deterministic validation still failed after the automatic repair pass."
              echo "No changes were pushed and main was not modified."
            } > "${tmp}"
          elif [[ -n "${PR_URL}" ]]; then
            {
              echo "✅ Gemini implementation was validated and published for review."
              echo
              echo "Branch: \`${BRANCH}\`"
              echo "Pull Request: ${PR_URL}"
              echo "Initial validation passed: \`${INITIAL_PASSED}\`"
              echo "Final validation passed: \`git diff --check\`, \`npm run build\`, and \`npm run check\`."
              if [[ -n "${GEMINI_RESPONSE//[[:space:]]/}" ]]; then
                echo
                echo "### Gemini implementation summary"
                printf '%s\n' "${GEMINI_RESPONSE}"
              fi
              if [[ -n "${REPAIR_RESPONSE//[[:space:]]/}" ]]; then
                echo
                echo "### Automatic repair summary"
                printf '%s\n' "${REPAIR_RESPONSE}"
              fi
            } > "${tmp}"
          elif [[ "${PUBLISH_OUTCOME}" == "success" && -n "${BRANCH}" ]]; then
            echo "⚠️ Validated changes were pushed to \`${BRANCH}\`, but automatic PR creation was not permitted." > "${tmp}"
          else
            echo "❌ Validated Gemini changes could not be published. Main was not modified." > "${tmp}"
          fi

          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body-file "${tmp}"
