name: '🧙 Gemini Plan Execution'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

concurrency:
  group: '${{ github.workflow }}-plan-execute-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  plan-execute:
    timeout-minutes: 30
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Checkout Code'
        uses: 'actions/checkout@v4'
        with:
          persist-credentials: 'false'

      - name: 'Prepare prompt context'
        shell: 'bash'
        run: |-
          mkdir -p .gemini
          jq -n \
            --arg title "${TITLE}" \
            --arg desc "${DESCRIPTION}" \
            --arg event "${EVENT_NAME}" \
            --arg pr "${IS_PULL_REQUEST}" \
            --arg num "${ISSUE_NUMBER}" \
            --arg repo "${REPOSITORY}" \
            --arg context "${ADDITIONAL_CONTEXT}" \
            '{title: $title, description: $desc, event_name: $event, is_pull_request: $pr, issue_number: $num, repository: $repo, additional_context: $context}' > .gemini/context.json
        env:
          TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          DESCRIPTION: '${{ github.event.pull_request.body || github.event.issue.body }}'
          EVENT_NAME: '${{ github.event_name }}'
          IS_PULL_REQUEST: '${{ !!github.event.pull_request }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'

      - name: 'Run Gemini CLI'
        id: 'run_gemini'
        uses: 'google-github-actions/run-gemini-cli@v0'
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
        with:
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: '0.40.0'
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: '${{ vars.GEMINI_MODEL }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-plan-execute'
          github_pr_number: '${{ github.event.pull_request.number }}'
          github_issue_number: '${{ github.event.issue.number }}'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 60
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "add_issue_comment",
                    "issue_read",
                    "list_issues",
                    "search_issues",
                    "create_pull_request",
                    "pull_request_read",
                    "list_pull_requests",
                    "search_pull_requests",
                    "create_branch",
                    "create_or_update_file",
                    "delete_file",
                    "get_commit",
                    "get_file_contents",
                    "list_commits",
                    "push_files",
                    "search_code"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": [
                  "read_file",
                  "read_many_files",
                  "glob",
                  "grep_search",
                  "list_directory",
                  "write_file",
                  "replace",
                  "run_shell_command(echo)",
                  "run_shell_command(npm)",
                  "run_shell_command(node)",
                  "run_shell_command(git)"
                ]
              }
            }
          prompt: |-
            You are the approved implementation agent for this GitHub repository.

            First read `GEMINI.md` and `.gemini/context.json`. Then use the GitHub MCP `issue_read` capability to read the current Issue and its comments using the repository and issue_number from `.gemini/context.json`.

            Locate the latest substantive Issue comment whose plan heading is `AI Assistant: Plan of Action` and that appears before the owner's current `@gemini-cli /approve` trigger. The short placeholder plan that only asks for clarification or says context is empty is not an approved implementation plan. If no substantive visible plan exists, do not modify any files; return a clear final response explaining that execution is blocked until a substantive plan is published and approved.

            If a substantive plan exists and the current context confirms explicit owner approval, execute only that approved plan while following `GEMINI.md`.

            Mandatory implementation rules:
            - Never push or write directly to `main`.
            - Create a dedicated branch beginning with `gemini/`, preferably `gemini/issue-<number>-<short-topic>`.
            - Preserve existing valuable functionality and avoid unrelated rewrites.
            - Make the code changes on the dedicated branch.
            - Run the relevant validation, including `npm run build` and `npm run check` when the repository supports them. Do not claim they pass unless they actually pass.
            - Open a Pull Request targeting `main`. Never merge your own Pull Request.
            - If implementation is too large for one safe PR, implement the first coherent approved phase and state clearly what remains for later PRs rather than creating an unreviewable mega-change.
            - Do not expose secrets, API keys, private uploaded documents, or private user data.

            Use local edit tools for working-tree changes and GitHub MCP write tools for the remote branch/PR as needed. `actions/checkout` intentionally has no persisted push credentials; do not attempt to bypass that safeguard or push directly to `main`.

            Return a final execution summary as the Gemini response, including branch, Pull Request, files changed, tests run/results, what was completed, and anything still pending. The workflow will publish that final response back to the Issue.

      - name: 'Publish Gemini execution result'
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          GEMINI_RESPONSE: '${{ steps.run_gemini.outputs.summary }}'
          GEMINI_ERROR: '${{ steps.run_gemini.outputs.error }}'
          GEMINI_OUTCOME: '${{ steps.run_gemini.outcome }}'
        run: |-
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "${tmp}"' EXIT
          if [[ "${GEMINI_OUTCOME}" == "success" && -n "${GEMINI_RESPONSE//[[:space:]]/}" ]]; then
            python - <<'PY' > "${tmp}"
          import os
          text = os.environ.get('GEMINI_RESPONSE', '').strip()
          limit = 58000
          if len(text) > limit:
              text = text[:limit] + '\n\n---\n_Response truncated by workflow to stay within GitHub comment limits._'
          print(text)
          PY
          elif [[ "${GEMINI_OUTCOME}" == "success" ]]; then
            cat > "${tmp}" <<'EOF'
          ⚠️ Gemini execution finished with an empty public summary. Verify that a `gemini/*` branch and Pull Request exist before treating implementation as complete.
          EOF
          else
            cat > "${tmp}" <<'EOF'
          ❌ Gemini execution failed. No code change should be treated as completed until the Actions failure is reviewed and a Pull Request is visible.
          EOF
          fi
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body-file "${tmp}"
