name: '🧙 Gemini Plan Execution'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

concurrency:
  group: '${{ github.workflow }}-plan-execute-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  plan-execute:
    timeout-minutes: 45
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Checkout Code'
        uses: 'actions/checkout@v4'
        with:
          persist-credentials: 'false'

      - name: 'Prepare prompt context'
        shell: 'bash'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
          TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          DESCRIPTION: '${{ github.event.pull_request.body || github.event.issue.body }}'
          EVENT_NAME: '${{ github.event_name }}'
          IS_PULL_REQUEST: '${{ !!github.event.pull_request }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
        run: |-
          set -euo pipefail

          comments_file="$(mktemp)"
          trap 'rm -f "${comments_file}"' EXIT

          if [[ -n "${ISSUE_NUMBER}" ]]; then
            gh api "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" > "${comments_file}"
          else
            printf '[]' > "${comments_file}"
          fi

          latest_plan="$(jq -r '[.[] | select((.body // "") | contains("AI Assistant: Plan of Action"))] | last | .body // ""' "${comments_file}")"

          jq -n \
            --arg title "${TITLE}" \
            --arg desc "${DESCRIPTION}" \
            --arg event "${EVENT_NAME}" \
            --arg pr "${IS_PULL_REQUEST}" \
            --arg num "${ISSUE_NUMBER}" \
            --arg repo "${REPOSITORY}" \
            --arg context "${ADDITIONAL_CONTEXT}" \
            --arg latest_plan "${latest_plan}" \
            '{title: $title, description: $desc, event_name: $event, is_pull_request: $pr, issue_number: $num, repository: $repo, additional_context: $context, latest_plan: $latest_plan}' > gemini-context.json

          if [[ -z "${latest_plan//[[:space:]]/}" ]]; then
            echo "No substantive AI Assistant plan was found in Issue comments." >&2
            exit 1
          fi

      - name: 'Run Gemini CLI'
        id: 'run_gemini'
        uses: 'google-github-actions/run-gemini-cli@v0'
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
        with:
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: '0.40.0'
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: 'gemini-3-flash-preview'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-plan-execute'
          github_pr_number: '${{ github.event.pull_request.number }}'
          github_issue_number: '${{ github.event.issue.number }}'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 120
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "add_issue_comment",
                    "issue_read",
                    "list_issues",
                    "search_issues",
                    "create_pull_request",
                    "pull_request_read",
                    "list_pull_requests",
                    "search_pull_requests",
                    "create_branch",
                    "create_or_update_file",
                    "delete_file",
                    "get_commit",
                    "get_file_contents",
                    "list_commits",
                    "push_files",
                    "search_code"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": [
                  "read_file",
                  "read_many_files",
                  "glob",
                  "grep_search",
                  "list_directory",
                  "write_file",
                  "replace",
                  "run_shell_command(npm)",
                  "run_shell_command(node)",
                  "run_shell_command(git)"
                ]
              }
            }
          prompt: |-
            You are the approved implementation agent for this GitHub repository.

            First read `GEMINI.md` and `gemini-context.json` with `read_file`.

            `gemini-context.json` is generated by the workflow and is authoritative for this run. It contains the repository, Issue number, original Issue description, explicit approval context, and `latest_plan`. The workflow itself fetched `latest_plan` from the current GitHub Issue before starting Gemini, so do not spend turns trying to rediscover the plan through GitHub.

            Never modify, commit, or include `gemini-context.json` in any branch or Pull Request.

            If `latest_plan` is empty, or `additional_context` does not clearly confirm owner approval, stop without modifying files and explain why. Otherwise execute the approved `latest_plan` while following `GEMINI.md`.

            IMPORTANT TOOL NAMING:
            The GitHub MCP tools registered in this Gemini CLI session use names prefixed with `mcp_github_`. When you need remote GitHub operations, use the registered MCP tools by their exact names, including:
            - `mcp_github_create_branch`
            - `mcp_github_create_or_update_file`
            - `mcp_github_push_files`
            - `mcp_github_create_pull_request`
            - `mcp_github_get_file_contents`
            - `mcp_github_pull_request_read`
            Do not call tools named `github:issue_read`, `github:create_branch`, `issue_read`, or other unregistered aliases.

            Implementation procedure:
            1. Inspect the repository and choose only the first coherent high-priority phase of the approved plan. Do not attempt the entire application in one run.
            2. Create a dedicated remote branch using `mcp_github_create_branch`. Its name must begin with `gemini/`, preferably `gemini/issue-<number>-<short-topic>`. Never write to `main`.
            3. Make the corresponding code changes in the local working tree using `write_file` / `replace` as appropriate. Preserve existing valuable functionality and avoid unrelated rewrites.
            4. Run relevant validation. At minimum, when supported by the repository, run `npm run build` and `npm run check`. Do not claim tests passed unless they actually passed.
            5. After validation, publish only the intended changed application files to the remote `gemini/*` branch using `mcp_github_push_files` or `mcp_github_create_or_update_file`. Never include `gemini-context.json`, `.gemini/`, credentials, logs, generated secrets, or unrelated files.
            6. Open a Pull Request targeting `main` using `mcp_github_create_pull_request`. Never merge your own Pull Request.
            7. If a safe implementation cannot be completed, do not fabricate success. Return the exact blocker and leave `main` untouched.

            Shell policy:
            - Use shell only for permitted repository validation such as `npm run build`, `npm run check`, targeted `node` validation, and safe local `git status` / `git diff` inspection.
            - Do not use `gh` or raw `git push` for remote writes. Remote branch/file/PR writes must use the GitHub MCP tools above.
            - Do not waste turns probing unavailable tools, CLI help, system directories, or ignored `.git` internals.

            Return a final execution summary as the Gemini response with:
            - implemented phase
            - branch name
            - Pull Request number/link if created
            - files changed
            - tests executed and exact results
            - completed work
            - remaining phases
            - any unresolved risks or blockers

      - name: 'Publish Gemini execution result'
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          GEMINI_RESPONSE: '${{ steps.run_gemini.outputs.summary }}'
          GEMINI_ERROR: '${{ steps.run_gemini.outputs.error }}'
          GEMINI_OUTCOME: '${{ steps.run_gemini.outcome }}'
        run: |-
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "${tmp}"' EXIT
          if [[ "${GEMINI_OUTCOME}" == "success" && -n "${GEMINI_RESPONSE//[[:space:]]/}" ]]; then
            python - <<'PY' > "${tmp}"
          import os
          text = os.environ.get('GEMINI_RESPONSE', '').strip()
          limit = 58000
          if len(text) > limit:
              text = text[:limit] + '\n\n---\n_Response truncated by workflow to stay within GitHub comment limits._'
          print(text)
          PY
          elif [[ "${GEMINI_OUTCOME}" == "success" ]]; then
            cat > "${tmp}" <<'EOF'
          ⚠️ Gemini execution finished with an empty public summary. Verify that a `gemini/*` branch and Pull Request exist before treating implementation as complete.
          EOF
          else
            cat > "${tmp}" <<'EOF'
          ❌ Gemini execution failed. No code change should be treated as completed until the Actions failure is reviewed and a Pull Request is visible.
          EOF
          fi
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body-file "${tmp}"
