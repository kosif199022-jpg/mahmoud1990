name: '🧙 Gemini Plan Execution'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

concurrency:
  group: '${{ github.workflow }}-plan-execute-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  plan-execute:
    timeout-minutes: 45
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Checkout Code'
        uses: 'actions/checkout@v4'
        with:
          persist-credentials: 'false'
          fetch-depth: 1

      - name: 'Prepare prompt context'
        shell: 'bash'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
          TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          DESCRIPTION: '${{ github.event.pull_request.body || github.event.issue.body }}'
          EVENT_NAME: '${{ github.event_name }}'
          IS_PULL_REQUEST: '${{ !!github.event.pull_request }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
        run: |-
          set -euo pipefail

          comments_file="$(mktemp)"
          trap 'rm -f "${comments_file}"' EXIT

          if [[ -n "${ISSUE_NUMBER}" ]]; then
            gh api "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" > "${comments_file}"
          else
            printf '[]' > "${comments_file}"
          fi

          # Prefer an explicitly pinned development plan. A maintainer can pin a
          # plan without triggering Gemini by posting: <!-- gemini-approved-plan:123456 -->
          approved_plan_id="$(jq -r '
            [
              .[]
              | select((.body // "") | test("gemini-approved-plan:[0-9]+"))
              | ((.body // "") | capture("gemini-approved-plan:(?<id>[0-9]+)").id)
            ]
            | last // ""
          ' "${comments_file}")"

          if [[ -n "${approved_plan_id}" ]]; then
            plan_comment="$(jq -c --arg id "${approved_plan_id}" '
              [.[] | select((.id | tostring) == $id)] | last // {}
            ' "${comments_file}")"
          else
            # Safe fallback: ignore placeholders, model-verification plans and
            # narrow release-alignment test plans. Require a genuinely broad plan.
            plan_comment="$(jq -c '
              [
                .[]
                | select((.body // "") | contains("AI Assistant: Plan of Action"))
                | select((((.body // "") | contains("Request clarification"))) | not)
                | select((((.body // "") | contains("context is empty"))) | not)
                | select((((.body // "") | contains("Model verification"))) | not)
                | select((((.body // "") | contains("Core Version Alignment"))) | not)
                | select(((.body // "") | length) > 2500)
              ]
              | last // {}
            ' "${comments_file}")"
          fi

          latest_plan="$(jq -r '.body // ""' <<< "${plan_comment}")"
          latest_plan_id="$(jq -r '.id // ""' <<< "${plan_comment}")"

          if [[ -z "${latest_plan//[[:space:]]/}" ]] || ! grep -q 'AI Assistant: Plan of Action' <<< "${latest_plan}"; then
            echo "No valid substantive AI Assistant development plan was selected." >&2
            exit 1
          fi

          if [[ ${#latest_plan} -lt 2500 ]]; then
            echo "Selected plan is too short to be treated as the approved full development plan." >&2
            exit 1
          fi

          echo "Selected Gemini development plan comment: ${latest_plan_id}"

          jq -n \
            --arg title "${TITLE}" \
            --arg desc "${DESCRIPTION}" \
            --arg event "${EVENT_NAME}" \
            --arg pr "${IS_PULL_REQUEST}" \
            --arg num "${ISSUE_NUMBER}" \
            --arg repo "${REPOSITORY}" \
            --arg context "${ADDITIONAL_CONTEXT}" \
            --arg latest_plan "${latest_plan}" \
            --arg latest_plan_comment_id "${latest_plan_id}" \
            '{title: $title, description: $desc, event_name: $event, is_pull_request: $pr, issue_number: $num, repository: $repo, additional_context: $context, latest_plan: $latest_plan, latest_plan_comment_id: $latest_plan_comment_id}' > gemini-context.json

      - name: 'Run Gemini CLI'
        id: 'run_gemini'
        uses: 'google-github-actions/run-gemini-cli@v0'
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: '0.40.0'
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: 'gemini-3-flash-preview'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-plan-execute'
          github_pr_number: '${{ github.event.pull_request.number }}'
          github_issue_number: '${{ github.event.issue.number }}'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 120
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "tools": {
                "core": [
                  "read_file",
                  "read_many_files",
                  "glob",
                  "grep_search",
                  "list_directory",
                  "write_file",
                  "replace"
                ]
              }
            }
          prompt: |-
            You are the approved implementation agent for this GitHub repository.

            First read `GEMINI.md` and `gemini-context.json` with `read_file`.

            `gemini-context.json` is generated by the workflow and is authoritative for this run. It contains the repository, Issue number, original Issue description, explicit approval context, the selected substantive `AI Assistant: Plan of Action` in `latest_plan`, and its exact Issue comment ID in `latest_plan_comment_id`.

            If `latest_plan` is empty, `latest_plan_comment_id` is empty, or `additional_context` does not clearly confirm owner approval, stop without modifying application files and explain why.

            Otherwise implement only the first coherent high-priority phase of THAT EXACT SELECTED PLAN. Do not substitute a different plan from memory, an earlier test, model-verification work, or a version-alignment experiment. Do not attempt the entire application in one run.

            Before editing any file:
            - Inspect the files involved in the selected phase.
            - Inspect `package.json` and the relevant regression/contract scripts in `scripts/` that constrain those files.
            - Treat existing regression tests, historical compatibility identifiers, accounting invariants, security gates, and mobile/iPhone safety contracts as hard requirements.
            - A historical `v36.3` identifier or query string is NOT automatically stale; preserve it when tests/contracts intentionally require it.

            Mandatory implementation rules:
            - Work only in the local checked-out working tree.
            - Do NOT create a Git branch, commit, remote write, Issue comment, or Pull Request yourself. The GitHub Actions workflow will validate and publish your local changes after you finish.
            - Do NOT run shell commands or probe unavailable tools. Validation is performed by the workflow after your edits.
            - Never modify, delete, commit, or include `gemini-context.json`, `.gemini/`, credentials, logs, secrets, or private user data.
            - Preserve existing valuable functionality and avoid unrelated rewrites.
            - Keep deterministic accounting calculations deterministic; do not replace them with AI guesses.
            - Preserve Arabic-first RTL behavior and mobile/iPhone behavior unless the approved phase explicitly improves them.
            - Never weaken, remove, bypass, or rewrite tests merely to make your change pass.
            - Do not change `.github/workflows/`, test scripts, release contracts, schema versions, cache generations, or version identifiers unless the selected development phase explicitly requires that exact infrastructure/release change.
            - Prefer a small, coherent, reviewable implementation over broad mechanical replacements.
            - Make concrete code changes using `write_file` and `replace` only where supported by repository evidence.
            - If a safe implementation is not possible, make no speculative changes and clearly report the blocker.

            Return a concise final execution summary with:
            - selected plan comment ID
            - implemented phase
            - files changed
            - key changes
            - tests that the workflow should run
            - remaining phases
            - unresolved risks or blockers

      - name: 'Remove generated agent files'
        if: ${{ steps.run_gemini.outcome == 'success' }}
        run: |-
          set -euo pipefail
          rm -f gemini-context.json
          rm -rf gemini-artifacts

      - name: 'Detect implementation changes'
        id: 'changes'
        if: ${{ steps.run_gemini.outcome == 'success' }}
        run: |-
          set -euo pipefail
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -z "${status}" ]]; then
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
            echo "Gemini completed but produced no repository changes."
          else
            echo "has_changes=true" >> "${GITHUB_OUTPUT}"
            echo "Repository changes detected:"
            printf '%s\n' "${status}"
          fi

      - name: 'Validate implementation changes'
        id: 'validate'
        if: ${{ steps.changes.outputs.has_changes == 'true' }}
        run: |-
          set -euo pipefail
          git diff --check
          npm run build
          npm run check

      - name: 'Publish implementation branch and Pull Request'
        id: 'publish'
        if: ${{ steps.changes.outputs.has_changes == 'true' && steps.validate.outcome == 'success' }}
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          GEMINI_RESPONSE: '${{ steps.run_gemini.outputs.summary }}'
        run: |-
          set -euo pipefail

          branch="gemini/issue-${ISSUE_NUMBER}-run-${GITHUB_RUN_ID}"

          rm -f gemini-context.json
          rm -rf gemini-artifacts

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "has_published_changes=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git commit -m "feat: implement approved Gemini phase for issue #${ISSUE_NUMBER}"

          gh auth setup-git
          git push origin "HEAD:refs/heads/${branch}"

          body_file="$(mktemp)"
          trap 'rm -f "${body_file}"' EXIT
          {
            echo "Implements the explicitly selected approved Gemini development phase from #${ISSUE_NUMBER}."
            echo
            echo "Validation executed by GitHub Actions before publication:"
            echo "- git diff --check"
            echo "- npm run build"
            echo "- npm run check"
            echo
            echo "The PR is intentionally not auto-merged and requires human review."
            if [[ -n "${GEMINI_RESPONSE//[[:space:]]/}" ]]; then
              echo
              echo "Gemini implementation summary:"
              echo
              printf '%s\n' "${GEMINI_RESPONSE}"
            fi
          } > "${body_file}"

          pr_url=""
          if pr_url="$(gh pr create --repo "${REPOSITORY}" --base main --head "${branch}" --title "feat: approved Gemini implementation for #${ISSUE_NUMBER}" --body-file "${body_file}")"; then
            echo "pr_url=${pr_url}" >> "${GITHUB_OUTPUT}"
            echo "pr_number=${pr_url##*/}" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::The branch was published, but GitHub Actions could not create the Pull Request."
          fi

          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
          echo "has_published_changes=true" >> "${GITHUB_OUTPUT}"

      - name: 'Publish Gemini execution result'
        if: ${{ always() }}
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          GEMINI_RESPONSE: '${{ steps.run_gemini.outputs.summary }}'
          GEMINI_OUTCOME: '${{ steps.run_gemini.outcome }}'
          HAS_CHANGES: '${{ steps.changes.outputs.has_changes }}'
          VALIDATION_OUTCOME: '${{ steps.validate.outcome }}'
          PUBLISH_OUTCOME: '${{ steps.publish.outcome }}'
          BRANCH: '${{ steps.publish.outputs.branch }}'
          PR_URL: '${{ steps.publish.outputs.pr_url }}'
        run: |-
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "${tmp}"' EXIT

          if [[ "${GEMINI_OUTCOME}" != "success" ]]; then
            cat > "${tmp}" <<'EOF'
          ❌ Gemini execution failed before a validated application change could be published. No implementation should be treated as complete.
          EOF
          elif [[ "${HAS_CHANGES}" != "true" ]]; then
            cat > "${tmp}" <<'EOF'
          ⚠️ Gemini completed successfully but produced no repository changes, so no implementation branch or Pull Request was created.
          EOF
          elif [[ "${VALIDATION_OUTCOME}" != "success" ]]; then
            cat > "${tmp}" <<'EOF'
          ❌ Gemini changed application files, but deterministic workflow validation failed. The changes were not pushed and no Pull Request was created.
          EOF
          elif [[ -n "${PR_URL}" ]]; then
            {
              echo "✅ Gemini implementation was validated and published for review."
              echo
              echo "Branch: \`${BRANCH}\`"
              echo "Pull Request: ${PR_URL}"
              echo
              echo "Validation passed: \`git diff --check\`, \`npm run build\`, and \`npm run check\`."
              if [[ -n "${GEMINI_RESPONSE//[[:space:]]/}" ]]; then
                echo
                echo "### Gemini implementation summary"
                echo
                printf '%s\n' "${GEMINI_RESPONSE}"
              fi
            } > "${tmp}"
          elif [[ "${PUBLISH_OUTCOME}" == "success" && -n "${BRANCH}" ]]; then
            {
              echo "⚠️ Gemini implementation passed validation and was pushed to branch \`${BRANCH}\`, but automatic Pull Request creation was not permitted."
              echo "The branch is preserved and can be opened as a Pull Request manually or by the repository integration."
            } > "${tmp}"
          else
            cat > "${tmp}" <<'EOF'
          ❌ Gemini changes passed validation, but publication failed before a reviewable Pull Request was available. Main was not modified.
          EOF
          fi

          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body-file "${tmp}"
