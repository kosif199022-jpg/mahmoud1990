name: Apply Kosif v36.3 History Restoration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-history-restoration-v36-3.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kosif-v36-3-history-restoration
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply restored historical capabilities
        run: node scripts/apply-history-restoration-v36-3.mjs
      - name: Full regression suite
        run: npm run check
      - name: Commit verified restoration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html frontend/index.html public/sw.js package.json docs/KOSIF_MASTER_REQUIREMENTS_2026-08-17.md
          if git diff --cached --quiet; then
            echo 'No generated source changes.'
          else
            git commit -m 'Wire verified historical voice language and entity capabilities'
            git push origin HEAD:main
          fi
