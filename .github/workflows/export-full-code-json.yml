name: Export Full Kosif JSON

on:
  push:
    branches: [main]
    paths-ignore:
      - 'Kosif-Full-Application-Source.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kosif-full-source-json-main
  cancel-in-progress: true

jobs:
  export:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build complete source JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json, base64, hashlib, subprocess, mimetypes
          from pathlib import Path

          root = Path('.')
          target_name = 'Kosif-Full-Application-Source.json'
          commit = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          files = {}
          total_bytes = 0

          for p in sorted(root.rglob('*')):
              if not p.is_file():
                  continue
              rel = p.as_posix()
              if rel.startswith('.git/') or rel == target_name:
                  continue
              data = p.read_bytes()
              total_bytes += len(data)
              sha256 = hashlib.sha256(data).hexdigest()
              mime = mimetypes.guess_type(rel)[0] or 'application/octet-stream'
              try:
                  text = data.decode('utf-8')
                  files[rel] = {
                      'encoding': 'utf-8',
                      'mime': mime,
                      'bytes': len(data),
                      'sha256': sha256,
                      'content': text,
                  }
              except UnicodeDecodeError:
                  files[rel] = {
                      'encoding': 'base64',
                      'mime': mime,
                      'bytes': len(data),
                      'sha256': sha256,
                      'content': base64.b64encode(data).decode('ascii'),
                  }

          out = {
              'format': 'kosif-complete-source-json-v1',
              'application': 'Kosif',
              'repository': 'kosif199022-jpg/mahmoud1990',
              'branch': 'main',
              'commit': commit,
              'generated_at_utc': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
              'file_count': len(files),
              'source_bytes': total_bytes,
              'notes': [
                  'Complete repository snapshot excluding .git metadata and the previously generated JSON export itself.',
                  'UTF-8 files are stored verbatim; binary files are Base64 encoded.',
                  'No GitHub Actions secrets are included because repository checkout cannot read secret values.'
              ],
              'files': files,
          }
          target = Path(target_name)
          target.write_text(json.dumps(out, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          print('commit=', commit)
          print('files=', len(files))
          print('source_bytes=', total_bytes)
          print('json_bytes=', target.stat().st_size)
          PY

      - name: Validate JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          p='Kosif-Full-Application-Source.json'
          with open(p,encoding='utf-8') as f: d=json.load(f)
          assert d['file_count'] == len(d['files'])
          for required in ['src/legacy-worker.js','src/library-module.js','src/kosif-workspace.js','src/suite-edge.js','src/v38-api.js','public/index.html','public/v36.css','public/v36-ai-gate.js','public/standards/index.html','wrangler.toml']:
              assert required in d['files'], required
          print('JSON_VALID', d['commit'], d['file_count'])
          PY

      - name: Upload complete JSON
        uses: actions/upload-artifact@v4
        with:
          name: kosif-full-application-json
          path: Kosif-Full-Application-Source.json
          compression-level: 9
          retention-days: 7

      - name: Publish JSON on main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Kosif-Full-Application-Source.json
          if git diff --cached --quiet; then
            echo 'Full source JSON already current.'
            exit 0
          fi
          git commit -m 'chore: publish current full source JSON [skip ci]'
          git push origin HEAD:main
