name: Fix Kosif v36.1.3 Library Routing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-library-routing-v36-1-3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply native standards routing fix
        run: python3 scripts/fix-library-routing-v36-1-3.py
      - name: Validate library source and routes locally
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'https://kosif-standards-library.kosif199022.workers.dev/' public/index.html
          grep -q 'id="kosif-full-standards" href="/standards/"' public/index.html
          grep -q 'فتح القارئ داخل Kosif' public/index.html
          node --check src/worker.js
          node --check src/library-module.js
          nohup npx --yes wrangler@4 dev --local --port 8790 >/tmp/wrangler-library.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8790/__health >/dev/null 2>&1 && break; sleep 1; done
          test "$(curl -sS -o /tmp/std.html -w '%{http_code}' http://127.0.0.1:8790/standards/)" = 200
          grep -q 'reader-pro-v36.js?v=36.1' /tmp/std.html
          test "$(curl -sS -o /tmp/b1.json -w '%{http_code}' http://127.0.0.1:8790/standards/data/b1/1.json)" = 200
          node -e "const x=require('/tmp/b1.json'); if(!x||!x.title) process.exit(1); console.log('standard chapter',x.title)"
          smart=$(curl -sS -o /tmp/smart.html -w '%{http_code}' http://127.0.0.1:8790/library/smart || true)
          echo "smart_library_http=$smart"
          if [ "$smart" = 200 ]; then grep -qi 'library\|مكتبة\|كتاب' /tmp/smart.html; fi
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html frontend/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix standards library button to native /standards reader'
          git pull --rebase origin main
          git push origin HEAD:main
