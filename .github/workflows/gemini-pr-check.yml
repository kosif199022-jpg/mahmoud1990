name: '✅ Gemini PR Validation'

on:
  pull_request:
    branches:
      - 'main'

jobs:
  validate-gemini-change:
    if: |-
      startsWith(github.head_ref, 'gemini/')
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    permissions:
      contents: 'read'
    steps:
      - name: 'Checkout proposed change'
        uses: 'actions/checkout@v4'

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@v4'
        with:
          node-version: '22'

      - name: 'Build generated assets'
        run: 'npm run build'

      - name: 'Run full regression gate'
        run: 'npm run check'
