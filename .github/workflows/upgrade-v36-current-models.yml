name: Upgrade Kosif v36 Current Provider Models

on:
  push:
    branches: [v36-consolidated]
    paths: ['.github/workflows/upgrade-v36-current-models.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v36-consolidated
      - name: Update provider defaults from current official docs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/v36-ai-backend.js.txt');s=p.read_text()
          s=s.replace("model=model||'gpt-5';", "model=model||'gpt-5.6';")
          s=s.replace("model=model||'gemini-2.5-flash';const generationConfig={temperature:.2,maxOutputTokens:maxTokens};", "model=model||'gemini-3.6-flash';const generationConfig={maxOutputTokens:maxTokens};")
          assert "model=model||'gpt-5.6';" in s
          assert "model=model||'gemini-3.6-flash';const generationConfig={maxOutputTokens:maxTokens};" in s
          p.write_text(s)
          p=Path('public/v36-governance.js');s=p.read_text();s=s.replace('value="gpt-5"','value="gpt-5.6"');s=s.replace('value="gemini-2.5-flash"','value="gemini-3.6-flash"');p.write_text(s)
          PY
          node scripts/patch-v36-ai.mjs
      - name: Validate updated provider adapters
        shell: bash
        run: |
          set -euo pipefail
          node --check public/v36-governance.js
          grep -q "gpt-5.6" src/kosif-workspace.js
          grep -q "gemini-3.6-flash" src/kosif-workspace.js
          ! grep -q "model=model||'gemini-2.5-flash'" src/kosif-workspace.js
          npx --yes esbuild src/worker.js --bundle --format=esm --platform=browser --outfile=/tmp/worker.mjs >/dev/null
          python3 - <<'PY'
          import re,pathlib,subprocess
          for fn in ['frontend/index.html','public/index.html']:
            s=pathlib.Path(fn).read_text();assert 'KOSIF_CLIENT_V36_2026_08_17' in s
            for i,x in enumerate(re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',s,re.I)):
              p=pathlib.Path('/tmp')/f'{pathlib.Path(fn).name}-{i}.js';p.write_text(x);subprocess.check_call(['node','--check',str(p)],stdout=subprocess.DEVNULL)
          PY
      - name: Commit current model defaults
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/v36-ai-backend.js.txt src/kosif-workspace.js frontend/index.html public/index.html public/v36-governance.js
          git diff --cached --quiet && exit 0
          git commit -m 'Use current GPT-5.6 and Gemini 3.6 Flash defaults'
          git pull --rebase origin v36-consolidated
          git push origin HEAD:v36-consolidated
