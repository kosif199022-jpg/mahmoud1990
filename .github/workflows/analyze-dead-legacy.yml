name: Analyze legacy dead declarations
on:
  push:
    branches: [v36-2-library-motion-hardening]
    paths: ['.github/workflows/analyze-dead-legacy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --package-lock=false acorn@8 acorn-walk@8
      - run: node scripts/analyze-dead-legacy.mjs
