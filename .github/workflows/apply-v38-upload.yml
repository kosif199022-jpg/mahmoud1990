name: Apply KOSIF v38 uploaded source

on:
  push:
    branches: [codex/v38-trusted-audit-os-import]
    paths:
      - '.v38-upload/**'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct trusted v38 source overlay
        shell: bash
        run: |
          set -euo pipefail
          test -f .v38-upload/archive.b64
          base64 -d .v38-upload/archive.b64 > /tmp/v38-overlay.tar.gz
          echo '9ccf385c83897735d9664ba84fca8e450cdd3273bdf07399d5d03e7f0c993d35  /tmp/v38-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v38-overlay.tar.gz -C .
          rm -rf .v38-upload
      - name: Install
        run: npm ci
      - name: Build v38 and generate deterministic lab
        run: npm run build
      - name: Full verification
        run: npm run check
      - name: Commit imported v38 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kosif-v38-import-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'feat: import KOSIF v38 Trusted Audit Intelligence OS'
          git push origin HEAD:codex/v38-trusted-audit-os-import
