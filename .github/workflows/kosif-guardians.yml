name: KOSIF Design & Code Guardians

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/kosif-guardians.mjs'
      - 'config/kosif-guardians.json'
      - '.github/workflows/kosif-guardians.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/kosif-guardians.mjs'
      - 'config/kosif-guardians.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardians:
    name: 10 design/code guardians
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run KOSIF Guardians
        run: node scripts/kosif-guardians.mjs frontend/index.html

      - name: Publish guardian reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kosif-design-code-guardians
          path: |
            artifacts/kosif-guardians-report.json
            artifacts/kosif-guardians-report.md
          if-no-files-found: warn
          retention-days: 14
