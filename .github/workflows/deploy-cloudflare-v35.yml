name: Deploy Kosif Native v35 to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cloudflare-v35.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kosif-live-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release before deploy
        shell: bash
        run: |
          set -euo pipefail
          test -f RELEASE_MANIFEST_V35.json
          test -f src/worker.js
          test -f public/index.html
          test -f public/standards/index.html
          node --check src/worker.js
          node --check public/standards/bridge.js
          node --check public/sw.js
          node -e "const m=require('./RELEASE_MANIFEST_V35.json'); if(!String(m.release).includes('Kosif Native v35')) process.exit(1); console.log(m.release)"

      - name: Deploy live Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9ff3d8494afab356ecbf95a2a231a6b5
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo 'CLOUDFLARE_API_TOKEN secret is missing' >&2
            exit 2
          fi
          npx --yes wrangler@4 deploy

      - name: Verify live v35
        shell: bash
        run: |
          set -euo pipefail
          URL='https://mahmoud-eldesouky.kosif199022.workers.dev'
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$URL/__health" || true)
            if [ "$code" = 200 ] && grep -q '"version":"v35"' /tmp/health.json; then
              cat /tmp/health.json
              break
            fi
            sleep 5
          done
          grep -q '"version":"v35"' /tmp/health.json
          headers=$(curl -sSI "$URL/" | tr -d '\r')
          echo "$headers"
          echo "$headers" | grep -qi '^x-kosif-release: native-v35-a1990$'
          curl -fsS "$URL/" -o /tmp/index.html
          grep -q 'kosif-bottom-nav' /tmp/index.html
          curl -fsS "$URL/standards/" -o /tmp/standards.html
          echo 'LIVE_KOSIF_V35_OK'
