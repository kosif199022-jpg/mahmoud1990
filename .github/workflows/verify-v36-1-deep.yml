name: Verify Kosif v36.2.1 Deep Runtime

on:
  push:
    branches: [main, v36-2-library-motion-hardening]
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/verify-v36-1-deep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install browser and validate build
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.54.2 >/dev/null
          npm run check
          npx playwright install chromium >/dev/null
          npx --yes esbuild src/worker.js --bundle --format=esm --platform=browser --outfile=/tmp/worker.mjs >/dev/null
      - name: Start local Cloudflare Worker
        shell: bash
        run: |
          nohup npx --yes wrangler@4 dev --local --port 8788 >/tmp/wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8788/__health >/tmp/health.json 2>/dev/null; then cat /tmp/health.json; exit 0; fi
            sleep 1
          done
          cat /tmp/wrangler.log
          exit 1
      - name: Verify mobile app, b4 isolation and motion
        run: node scripts/verify-v36-2-1-runtime.cjs
      - name: Upload screenshot and Worker log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kosif-v36-2-1-deep-runtime
          path: |
            kosif-v36-2-1-mobile.png
            /tmp/wrangler.log
          if-no-files-found: ignore
