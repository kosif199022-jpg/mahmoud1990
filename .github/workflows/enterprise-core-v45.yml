name: Enterprise Core v45

on:
  pull_request:
    paths:
      - 'config/enterprise-contract-v45.json'
      - 'enterprise/**'
      - 'src/enterprise-readiness-v45.mjs'
      - 'src/suite-edge-v43.js'
      - 'scripts/check-enterprise-contract.mjs'
      - 'tests/enterprise-readiness-v45.test.mjs'
      - 'package.json'
      - '.github/workflows/enterprise-core-v45.yml'
  push:
    branches: [main]
    paths:
      - 'config/enterprise-contract-v45.json'
      - 'enterprise/**'
      - 'src/enterprise-readiness-v45.mjs'
      - 'src/suite-edge-v43.js'
      - 'scripts/check-enterprise-contract.mjs'
      - 'tests/enterprise-readiness-v45.test.mjs'
      - 'package.json'

permissions:
  contents: read

jobs:
  enterprise-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-enterprise-contract.mjs
      - run: node --test tests/enterprise-readiness-v45.test.mjs
