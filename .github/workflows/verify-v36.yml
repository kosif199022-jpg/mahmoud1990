name: Verify Kosif v37 Production

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'frontend/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'RELEASE_MANIFEST_V36_4.json'
      - 'wrangler.toml'
      - '.github/workflows/verify-v36.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'frontend/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'RELEASE_MANIFEST_V36_4.json'
      - 'wrangler.toml'
      - '.github/workflows/verify-v36.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-kosif-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate current build and contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npx --yes esbuild src/suite-edge.js --bundle --format=esm --platform=browser --outfile=/tmp/suite-edge.mjs >/dev/null
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium webkit >/dev/null
      - name: Start local Worker
        shell: bash
        run: |
          nohup npx --yes wrangler@4 dev --local --port 8788 >/tmp/wrangler-production.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8788/__health >/tmp/health-production.json 2>/dev/null; then
              cat /tmp/health-production.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wrangler-production.log
          exit 1
      - name: Mobile production smoke test
        shell: bash
        run: |
          cat > /tmp/probe.cjs <<'NODE'
          const {chromium,webkit}=require(process.cwd()+'/node_modules/playwright');
          const fs=require('fs');
          const ok=(x,m)=>{if(!x)throw Error(m)};
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync('RELEASE_MANIFEST_V36_4.json','utf8'));
          const expectedLegacyVersion='v'+String(pkg.version||'').split('.').slice(0,2).join('.');
          const expectedLegacyBuild=String(manifest.buildId||'');
          const clean=s=>String(s||'').replace(/\s+/g,' ').trim();
          const BASE='http://127.0.0.1:8788';

          async function preparedExpectations(page,book){
            const indexResponse=await page.request.get(`${BASE}/wealth/books/${book}.json`);
            ok(indexResponse.ok(),`book index unavailable ${book}`);
            const idx=await indexResponse.json();
            const expectedTitle=clean(idx?.chapters?.[0]?.title);
            ok(expectedTitle,`missing first chapter title ${book}`);
            const chapterResponse=await page.request.get(`${BASE}/wealth/books/${book}/1.json`);
            ok(chapterResponse.ok(),`book chapter unavailable ${book}`);
            const chapter=await chapterResponse.json();
            const expectedBody=clean((chapter?.body||[]).map(x=>x?.[1]).find(Boolean)).slice(0,48);
            ok(expectedBody,`missing first chapter body ${book}`);
            return {expectedTitle,expectedBody};
          }

          async function verifyPreparedReader(page,book,label){
            const {expectedTitle,expectedBody}=await preparedExpectations(page,book);
            await page.goto(`${BASE}/wealth/reader.html?book=${book}&browser-verify=${encodeURIComponent(label)}`,{waitUntil:'domcontentloaded'});
            await page.waitForFunction(id=>location.pathname==='/libraries/reader.html'&&window.__KOSIF_PREPARED_READER__?.isolated===true&&window.__KOSIF_PREPARED_READER__?.book===id,book,{timeout:15000});
            await page.waitForFunction(title=>{
              const h=document.querySelector('#chapterTitle');
              const norm=s=>String(s||'').replace(/\s+/g,' ').trim();
              return h&&norm(h.textContent).includes(norm(title));
            },expectedTitle,{timeout:15000});
            await page.waitForFunction(snippet=>{
              const prose=document.querySelector('#chapterBody');
              const norm=s=>String(s||'').replace(/\s+/g,' ').trim();
              return prose&&norm(prose.textContent).includes(norm(snippet));
            },expectedBody,{timeout:15000});
            const visibleTitle=clean(await page.locator('#chapterTitle').textContent());
            const visibleBody=clean(await page.locator('#chapterBody').textContent());
            ok(visibleTitle.includes(expectedTitle),`${label}:${book} rendered wrong title: ${visibleTitle}`);
            ok(visibleBody.includes(expectedBody),`${label}:${book} rendered wrong body instead of selected chapter`);
            ok(!visibleTitle.includes('الامتنان: بداية الزيادة'),`${label}:${book} still visibly renders Mafateeh`);
            ok(await page.evaluate(()=>typeof window.D==='undefined'&&typeof window.CH==='undefined'),`${label}:${book} leaked Mafateeh D/CH globals`);
            ok(await page.evaluate(()=>localStorage.getItem('mk_lib_book')===null),`${label}:${book} legacy shared Wealth selector survived migration`);
            ok(await page.evaluate(()=>window.__KOSIF_PREPARED_READER__?.wealthServiceWorkerDetached===true),`${label}:${book} did not retire Wealth service-worker registration`);
          }

          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const errors=[],bad=[];
            p.on('pageerror',e=>errors.push(String(e.stack||e)));
            p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            p.on('response',r=>{const u=new URL(r.url());if(r.status()>=400&&!u.pathname.startsWith('/api/'))bad.push(r.status()+' '+u.pathname)});
            const health=await (await p.request.get(`${BASE}/__health`)).json();
            const suiteMode=/^v37\./.test(String(health.version||''));
            const auditPath=suiteMode?'/audit/':'/';
            if(suiteMode){
              ok(health.modules?.audit==='/audit/'&&health.modules?.wealth==='/wealth/reader.html'&&health.modules?.sales==='/sales/','suite route contract');
              ok(/v37-root-rebuild/.test(String(health.buildId||'')),'wrong suite build id');
            }else{
              ok(health.version===expectedLegacyVersion,`wrong health version: expected ${expectedLegacyVersion}, got ${health.version}`);
              ok(health.buildId===expectedLegacyBuild,`wrong health build: expected ${expectedLegacyBuild}, got ${health.buildId}`);
            }
            ok(Array.isArray(health.aiProviders)&&health.aiProviders.includes('zai'),'Z.ai missing from health providers');
            const version=await (await p.request.get(`${BASE}/__version`)).json();
            if(suiteMode){
              ok(version.version===health.version,'suite version endpoint mismatch');
              ok(version.buildId===health.buildId,'suite build endpoint mismatch');
              ok(version.legacyRelease===expectedLegacyVersion+'-compatible','legacy compatibility marker mismatch');
            }else{
              ok(version.version===expectedLegacyVersion,`wrong version endpoint: expected ${expectedLegacyVersion}, got ${version.version}`);
              ok(version.buildId===expectedLegacyBuild,`wrong build id: expected ${expectedLegacyBuild}, got ${version.buildId}`);
            }
            await p.goto(`${BASE}${auditPath}?verify=${encodeURIComponent(expectedLegacyVersion)}`,{waitUntil:'domcontentloaded'});
            await p.waitForTimeout(1800);
            ok(await p.locator('body').evaluate(e=>e.classList.contains('kosif-ready')),'not ready');
            ok(await p.locator('#kosif-boot').count()===0,'boot overlay');
            ok(await p.evaluate(()=>window.KosifZAI?.provider==='zai'&&document.documentElement.dataset.kosifZai==='ready'),'Z.ai UI bridge not ready');
            await p.evaluate(()=>applyDemo('holding',true));
            await p.waitForTimeout(600);
            ok(await p.locator('#tb-result tbody tr').count()>=100,'TB not rendered');
            for(const v of ['overview','tb','rounds','pbc','analytics','reviewer','map','outputs','council','governance','standards-readiness']){
              await p.evaluate(x=>go(x),v);await p.waitForTimeout(50);
              ok(await p.locator('#view-'+v).evaluate(e=>e.classList.contains('show')),'view '+v);
            }
            ok(await p.locator('#v36-risk-register tbody tr').count()>0,'risks missing');
            ok(await p.locator('#adj-body tbody tr').count()>=100,'adjusted TB missing');
            ok(await p.locator('#kosif-bottom-nav button').count()===5,'nav count');
            if(suiteMode){
              const hub=await p.request.get(`${BASE}/`);ok(hub.status()===200,'hub unavailable');
              const sales=await p.request.get(`${BASE}/sales/`);ok(sales.status()===200,'sales workspace unavailable');
              const preparedShell=await p.request.get(`${BASE}/libraries/reader.html?book=std2025`);ok(preparedShell.status()===200,'prepared reader shell unavailable');

              for(const book of ['std2025','std2018','dipifr'])await verifyPreparedReader(p,book,'chromium');

              // Mafateeh remains its original document/runtime and can re-register
              // its own /wealth/ offline worker when the user explicitly opens it.
              await p.goto(`${BASE}/wealth/reader.html?book=mafateeh&browser-verify=chromium`,{waitUntil:'domcontentloaded'});
              await p.waitForFunction(()=>window.__KOSIF_WEALTH_LIBRARY_ROUTER__===true&&document.title.includes('مفاتيح الثروة'),null,{timeout:15000});
              ok((await p.title()).includes('مفاتيح الثروة'),'return to original Mafateeh document failed');
              ok(await p.evaluate(()=>window.__KOSIF_WEALTH_LIBRARY_ROUTER__===true),'Mafateeh library router missing');
              console.log('KOSIF_PREPARED_READER_CHROMIUM_OK');
            }
            ok(bad.length===0,'HTTP '+bad.join(','));
            ok(!errors.some(x=>/ReferenceError|TypeError|SyntaxError|Kosif boot error/i.test(x)),'runtime '+errors.join('\n'));
            await b.close();

            if(suiteMode){
              // Playwright WebKit is not a physical iPhone, but it exercises the
              // WebKit engine path that previously diverged from Chromium/Safari.
              const wb=await webkit.launch({headless:true});
              const wp=await wb.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              const werrors=[];
              wp.on('pageerror',e=>werrors.push(String(e.stack||e)));
              wp.on('console',m=>{if(m.type()==='error')werrors.push(m.text())});
              for(const book of ['std2025','std2018','dipifr'])await verifyPreparedReader(wp,book,'webkit');
              ok(!werrors.some(x=>/ReferenceError|TypeError|SyntaxError/i.test(x)),'WebKit runtime '+werrors.join('\n'));
              await wb.close();
              console.log('KOSIF_PREPARED_READER_WEBKIT_OK');
            }

            console.log('KOSIF_PRODUCTION_VERIFY_OK',suiteMode?health.version:expectedLegacyVersion,suiteMode?health.buildId:expectedLegacyBuild);
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node /tmp/probe.cjs
      - name: Upload Worker log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kosif-v37-production-log
          path: /tmp/wrangler-production.log
          if-no-files-found: ignore
