name: Verify Kosif v36.3 Production

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'frontend/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'wrangler.toml'
      - '.github/workflows/verify-v36.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate v36.3 build and contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npx --yes esbuild src/worker.js --bundle --format=esm --platform=browser --outfile=/tmp/worker.mjs >/dev/null
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2 >/dev/null
          npx playwright install chromium >/dev/null
      - name: Start local Worker
        shell: bash
        run: |
          nohup npx --yes wrangler@4 dev --local --port 8788 >/tmp/wrangler-production.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8788/__health >/tmp/health-production.json 2>/dev/null; then
              cat /tmp/health-production.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wrangler-production.log
          exit 1
      - name: Mobile production smoke test
        shell: bash
        run: |
          cat > /tmp/probe.cjs <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const ok=(x,m)=>{if(!x)throw Error(m)};
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const errors=[],bad=[];
            p.on('pageerror',e=>errors.push(String(e.stack||e)));
            p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            p.on('response',r=>{const u=new URL(r.url());if(r.status()>=400&&!u.pathname.startsWith('/api/'))bad.push(r.status()+' '+u.pathname)});
            const health=await (await p.request.get('http://127.0.0.1:8788/__health')).json();
            ok(health.version==='v36.3','wrong health version');
            ok(Array.isArray(health.aiProviders)&&health.aiProviders.includes('zai'),'Z.ai missing from health providers');
            const version=await (await p.request.get('http://127.0.0.1:8788/__version')).json();
            ok(version.buildId==='2026.08.17-v36.3-master-requirements','wrong build id');
            await p.goto('http://127.0.0.1:8788/?verify=v36.3',{waitUntil:'domcontentloaded'});
            await p.waitForTimeout(1800);
            ok(await p.locator('body').evaluate(e=>e.classList.contains('kosif-ready')),'not ready');
            ok(await p.locator('#kosif-boot').count()===0,'boot overlay');
            ok(await p.evaluate(()=>window.KosifZAI?.provider==='zai'&&document.documentElement.dataset.kosifZai==='ready'),'Z.ai UI bridge not ready');
            await p.evaluate(()=>applyDemo('holding',true));
            await p.waitForTimeout(600);
            ok(await p.locator('#tb-result tbody tr').count()>=100,'TB not rendered');
            for(const v of ['overview','tb','rounds','pbc','analytics','reviewer','map','outputs','council','governance','standards-readiness']){
              await p.evaluate(x=>go(x),v);await p.waitForTimeout(50);
              ok(await p.locator('#view-'+v).evaluate(e=>e.classList.contains('show')),'view '+v);
            }
            ok(await p.locator('#v36-risk-register tbody tr').count()>0,'risks missing');
            ok(await p.locator('#adj-body tbody tr').count()>=100,'adjusted TB missing');
            ok(await p.locator('#kosif-bottom-nav button').count()===5,'nav count');
            ok(bad.length===0,'HTTP '+bad.join(','));
            ok(!errors.some(x=>/ReferenceError|TypeError|SyntaxError|Kosif boot error/i.test(x)),'runtime '+errors.join('\n'));
            await b.close();
            console.log('KOSIF_V36_3_PRODUCTION_VERIFY_OK');
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node /tmp/probe.cjs
      - name: Upload Worker log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kosif-v36-3-production-log
          path: /tmp/wrangler-production.log
          if-no-files-found: ignore
