name: Verify Kosif v38 Production

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'frontend/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'RELEASE_MANIFEST_V36_4.json'
      - 'wrangler.toml'
      - '.github/workflows/verify-v36.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'frontend/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'RELEASE_MANIFEST_V36_4.json'
      - 'wrangler.toml'
      - '.github/workflows/verify-v36.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-kosif-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate current build and contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npx --yes esbuild src/suite-edge.js --bundle --format=esm --platform=browser --outfile=/tmp/suite-edge.mjs >/dev/null
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium webkit >/dev/null
      - name: Start local Worker
        shell: bash
        run: |
          nohup npx --yes wrangler@4 dev --local --port 8788 >/tmp/wrangler-production.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8788/__health >/tmp/health-production.json 2>/dev/null; then
              cat /tmp/health-production.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wrangler-production.log
          exit 1
      - name: Mobile production smoke test
        shell: bash
        run: |
          cat > /tmp/probe.cjs <<'NODE'
          const {chromium,webkit}=require(process.cwd()+'/node_modules/playwright');
          const fs=require('fs');
          const ok=(x,m)=>{if(!x)throw Error(m)};
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync('RELEASE_MANIFEST_V36_4.json','utf8'));
          const expectedLegacyVersion='v'+String(pkg.version||'').split('.').slice(0,2).join('.');
          const expectedLegacyBuild=String(manifest.buildId||'');
          const clean=s=>String(s||'').replace(/\s+/g,' ').trim();
          const BASE='http://127.0.0.1:8788';

          async function expectations(page,book){
            const ir=await page.request.get(`${BASE}/wealth/books/${book}.json`);ok(ir.ok(),`book index unavailable ${book}`);
            const idx=await ir.json();const expectedTitle=clean(idx?.chapters?.[0]?.title);ok(expectedTitle,`missing first chapter title ${book}`);
            const cr=await page.request.get(`${BASE}/wealth/books/${book}/1.json`);ok(cr.ok(),`book chapter unavailable ${book}`);
            const chapter=await cr.json();const expectedBody=clean((chapter?.body||[]).map(x=>x?.[1]).find(Boolean)).slice(0,48);ok(expectedBody,`missing first chapter body ${book}`);
            return {expectedTitle,expectedBody};
          }
          async function verifySharedReader(page,book,label){
            const {expectedTitle,expectedBody}=await expectations(page,book);
            await page.goto(`${BASE}/wealth/reader.html?book=${book}&browser-verify=${label}`,{waitUntil:'domcontentloaded'});
            await page.waitForFunction(id=>window.__KOSIF_WEALTH_LIBRARY__===true&&window.D&&window.CH&&JSON.parse(localStorage.getItem('mk_lib_book')||'null')===id,book,{timeout:15000});
            await page.waitForFunction(title=>{const h=document.querySelector('#page .chead h2');const n=s=>String(s||'').replace(/\s+/g,' ').trim();return h&&n(h.textContent).includes(n(title))},expectedTitle,{timeout:15000});
            await page.waitForFunction(snippet=>{const p=document.querySelector('#prose');const n=s=>String(s||'').replace(/\s+/g,' ').trim();return p&&n(p.textContent).includes(n(snippet))},expectedBody,{timeout:15000});
            ok(clean(await page.locator('#page .chead h2').textContent()).includes(expectedTitle),`${label}:${book} wrong title`);
            ok(clean(await page.locator('#prose').textContent()).includes(expectedBody),`${label}:${book} wrong body`);
            ok(await page.evaluate(()=>typeof window.D==='object'&&Array.isArray(window.CH)),`${label}:${book} original D/CH runtime not active`);
            ok(await page.locator('#mixerDock').evaluate(e=>getComputedStyle(e).display==='none').catch(()=>true),`${label}:${book} mixer dock visible`);
            ok(await page.locator('#smartHubDock').evaluate(e=>getComputedStyle(e).display==='none').catch(()=>true),`${label}:${book} smart library dock visible`);
            ok(await page.locator('#libBtn').evaluate(e=>getComputedStyle(e).display==='none').catch(()=>true),`${label}:${book} internal library button visible`);
          }
          async function verifyDefault(page,label){
            await page.goto(`${BASE}/wealth/reader.html?browser-default=${label}`,{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.__KOSIF_WEALTH_LIBRARY__===true&&window.D?.meta?.title==='مفاتيح الثروة'&&JSON.parse(localStorage.getItem('mk_lib_book')||'null')==='mafateeh',null,{timeout:15000});
            ok((await page.title()).includes('مفاتيح الثروة'),`${label}: default reader title is not Mafateeh`);
            ok(await page.evaluate(()=>!document.querySelector('link[href*="wealth-theme-v37"]')&&!document.getElementById('kosif-suite-switcher')),`${label}: original Mafateeh screen overridden by Kosif shell/theme`);
          }

          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const errors=[],bad=[];p.on('pageerror',e=>errors.push(String(e.stack||e)));p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});p.on('response',r=>{const u=new URL(r.url());if(r.status()>=400&&!u.pathname.startsWith('/api/'))bad.push(r.status()+' '+u.pathname)});
            const health=await (await p.request.get(`${BASE}/__health`)).json();
            const suiteMode=/^v\d+\.\d+\.\d+-root$/.test(String(health.version||''));const auditPath=suiteMode?'/audit/':'/';
            if(suiteMode){ok(health.modules?.audit==='/audit/'&&health.modules?.wealth==='/wealth/reader.html'&&health.modules?.sales==='/sales/','suite route contract');ok(/v(?:37-root-rebuild|38-trusted-audit-os|38\.1-user-polish|38\.1\.2-kitab-caffe-visual-system)/.test(String(health.buildId||'')),'wrong suite build id')}else{ok(health.version===expectedLegacyVersion,'wrong health version');ok(health.buildId===expectedLegacyBuild,'wrong health build')}
            ok(Array.isArray(health.aiProviders)&&health.aiProviders.includes('zai'),'Z.ai missing from health providers');
            await p.goto(`${BASE}${auditPath}?verify=${encodeURIComponent(expectedLegacyVersion)}`,{waitUntil:'domcontentloaded'});await p.waitForTimeout(1800);ok(await p.locator('body').evaluate(e=>e.classList.contains('kosif-ready')),'audit not ready');ok(await p.locator('#kosif-boot').count()===0,'boot overlay');
            if(suiteMode){const hub=await p.request.get(`${BASE}/`);ok(hub.status()===200,'hub unavailable');const sales=await p.request.get(`${BASE}/sales/`);ok(sales.status()===200,'sales unavailable');for(const book of ['std2025','std2018','dipifr'])await verifySharedReader(p,book,'chromium');await verifyDefault(p,'chromium');console.log('KOSIF_SHARED_READER_CHROMIUM_OK')}
            ok(bad.length===0,'HTTP '+bad.join(','));ok(!errors.some(x=>/ReferenceError|TypeError|SyntaxError|Kosif boot error/i.test(x)),'runtime '+errors.join('\n'));await b.close();
            if(suiteMode){const wb=await webkit.launch({headless:true});const wp=await wb.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});const werrors=[];wp.on('pageerror',e=>werrors.push(String(e.stack||e)));wp.on('console',m=>{if(m.type()==='error')werrors.push(m.text())});for(const book of ['std2025','std2018','dipifr'])await verifySharedReader(wp,book,'webkit');await verifyDefault(wp,'webkit');ok(!werrors.some(x=>/ReferenceError|TypeError|SyntaxError/i.test(x)),'WebKit runtime '+werrors.join('\n'));await wb.close();console.log('KOSIF_SHARED_READER_WEBKIT_OK')}
            console.log('KOSIF_PRODUCTION_VERIFY_OK',suiteMode?health.version:expectedLegacyVersion,suiteMode?health.buildId:expectedLegacyBuild);
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node /tmp/probe.cjs
      - name: Upload Worker log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kosif-v38-production-log
          path: /tmp/wrangler-production.log
          if-no-files-found: ignore
