name: Deploy KOSIF Engineering Copilot MCP

on:
  pull_request:
    branches: [main]
    paths:
      - 'mcp/kosif-engineering-copilot/**'
      - '.github/workflows/deploy-kosif-mcp.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/kosif-engineering-copilot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install MCP dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck MCP server
        run: npm run typecheck

      - name: Ensure isolated OAuth KV namespace
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKE }}
          CLOUDFLARE_ACCOUNT_ID: 9ff3d8494afab356ecbf95a2a231a6b5
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          TITLE="kosif-engineering-copilot-mcp-oauth"

          curl -fsS "$API?per_page=100" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            -o /tmp/kosif-kv-list.json

          KV_ID=$(node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/kosif-kv-list.json','utf8'));
          const row=(j.result||[]).find(x=>x.title==='kosif-engineering-copilot-mcp-oauth');
          process.stdout.write(row?.id||'');
          NODE
          )

          if [ -z "$KV_ID" ]; then
            curl -fsS -X POST "$API" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data '{"title":"kosif-engineering-copilot-mcp-oauth"}' \
              -o /tmp/kosif-kv-create.json
            KV_ID=$(node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/kosif-kv-create.json','utf8'));
          if(!j.success || !j.result?.id){console.error(j);process.exit(2)}
          process.stdout.write(j.result.id);
          NODE
            )
          fi

          test -n "$KV_ID"
          VISUAL_SMOKE_KEY=$(openssl rand -hex 24)
          echo "::add-mask::$VISUAL_SMOKE_KEY"
          echo "VISUAL_SMOKE_KEY=$VISUAL_SMOKE_KEY" >> "$GITHUB_ENV"
          export KV_ID VISUAL_SMOKE_KEY

          node - <<'NODE'
          const fs=require('fs');
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          config.kv_namespaces=[{binding:'OAUTH_KV',id:process.env.KV_ID}];
          config.vars={...(config.vars||{}),VISUAL_SMOKE_KEY:process.env.VISUAL_SMOKE_KEY};
          fs.writeFileSync('wrangler.deploy.json',JSON.stringify(config,null,2)+'\n');
          NODE
          echo "OAuth KV namespace ready: $TITLE"

      - name: Deploy isolated OAuth-enabled MCP Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKE }}
          CLOUDFLARE_ACCOUNT_ID: 9ff3d8494afab356ecbf95a2a231a6b5
        run: npx wrangler deploy --config wrangler.deploy.json

      - name: Verify OAuth, Browser Run, and protected MCP
        shell: bash
        env:
          MCP_BASE_URL: https://kosif-engineering-copilot-mcp.kosif199022.workers.dev
        run: |
          set -euo pipefail

          probe_get() {
            name="$1"; url="$2"; file="/tmp/$name.out"
            code=$(curl -sS --connect-timeout 10 --max-time 30 -o "$file" -w '%{http_code}' "$url")
            echo "$name -> HTTP $code"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              cat "$file" || true
              exit 1
            fi
          }

          ok=0
          for attempt in $(seq 1 30); do
            code=$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/kosif-mcp-health.json -w '%{http_code}' "$MCP_BASE_URL/healthz" || true)
            if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/kosif-mcp-health.json && grep -q '"oauth":true' /tmp/kosif-mcp-health.json && grep -q '"visualCapture":true' /tmp/kosif-mcp-health.json; then
              ok=1
              break
            fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo "OAuth MCP health failed (HTTP ${code:-none})"; cat /tmp/kosif-mcp-health.json 2>/dev/null || true; exit 1; }
          echo "healthz -> HTTP 200"

          VISUAL_STATUS=$(curl -sS --connect-timeout 10 --max-time 45 -o /tmp/kosif-visual-smoke.json -w '%{http_code}' \
            -H "x-kosif-visual-smoke: $VISUAL_SMOKE_KEY" \
            "$MCP_BASE_URL/internal/visual-smoke")
          echo "browser_run_visual_smoke -> HTTP $VISUAL_STATUS"
          [ "$VISUAL_STATUS" = "200" ] || { cat /tmp/kosif-visual-smoke.json || true; exit 1; }
          grep -q '"ok":true' /tmp/kosif-visual-smoke.json
          node - <<'NODE'
          const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/kosif-visual-smoke.json','utf8'));
          if(!(j.bytes>1000)){console.error(j);process.exit(2)}
          console.log(`visual_capture_bytes=${j.bytes}`)
          NODE

          probe_get resource_metadata "$MCP_BASE_URL/.well-known/oauth-protected-resource/mcp"
          grep -q 'authorization_servers' /tmp/resource_metadata.out
          grep -q "$MCP_BASE_URL/mcp" /tmp/resource_metadata.out

          probe_get auth_server_metadata "$MCP_BASE_URL/.well-known/oauth-authorization-server"
          grep -q 'authorization_endpoint' /tmp/auth_server_metadata.out
          grep -q 'registration_endpoint' /tmp/auth_server_metadata.out
          grep -q 'code_challenge_methods_supported' /tmp/auth_server_metadata.out

          REG_STATUS=$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/kosif-register.json -w '%{http_code}' \
            -X POST "$MCP_BASE_URL/oauth/register" \
            -H 'content-type: application/json' \
            --data '{"client_name":"KOSIF CI Smoke","redirect_uris":["https://example.com/callback"],"token_endpoint_auth_method":"none","grant_types":["authorization_code"],"response_types":["code"]}')
          echo "dcr_register -> HTTP $REG_STATUS"
          if [ "$REG_STATUS" -lt 200 ] || [ "$REG_STATUS" -ge 300 ]; then
            cat /tmp/kosif-register.json || true
            exit 1
          fi

          CLIENT_ID=$(node - <<'NODE'
          const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/kosif-register.json','utf8'));
          if(!j.client_id){console.error(j);process.exit(2)}process.stdout.write(j.client_id);
          NODE
          )

          STATUS=$(curl -sS -o /tmp/kosif-mcp-unauth.txt -D /tmp/kosif-mcp-unauth.headers -w '%{http_code}' \
            -X POST "$MCP_BASE_URL/mcp" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{},"clientInfo":{"name":"kosif-ci-smoke","version":"1.0.0"}}}')
          echo "protected_mcp_without_token -> HTTP $STATUS"
          [ "$STATUS" = "401" ] || { cat /tmp/kosif-mcp-unauth.txt; exit 1; }
          grep -qi 'WWW-Authenticate: Bearer' /tmp/kosif-mcp-unauth.headers

          ENCODED_CLIENT=$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$CLIENT_ID")
          AUTH_URL="$MCP_BASE_URL/authorize?response_type=code&client_id=$ENCODED_CLIENT&redirect_uri=https%3A%2F%2Fexample.com%2Fcallback&scope=mcp%3Aread&state=ci-smoke&code_challenge=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA&code_challenge_method=S256&resource=https%3A%2F%2Fkosif-engineering-copilot-mcp.kosif199022.workers.dev%2Fmcp"
          AUTH_STATUS=$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/kosif-consent.html -w '%{http_code}' "$AUTH_URL")
          echo "authorize_consent -> HTTP $AUTH_STATUS"
          if [ "$AUTH_STATUS" != "200" ]; then cat /tmp/kosif-consent.html || true; exit 1; fi
          grep -q 'السماح والاتصال' /tmp/kosif-consent.html

          echo "KOSIF_VISUAL_MCP_READY=$MCP_BASE_URL/mcp"
