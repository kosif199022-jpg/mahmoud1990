name: Apply Kosif v36 Structured AI Bridge

on:
  push:
    branches: [v36-consolidated]
    paths: ['.github/workflows/apply-v36-ai.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v36-consolidated
      - name: Apply structured multimodal AI patch
        run: node scripts/patch-v36-ai.mjs
      - name: Validate worker modules and rendered scripts
        shell: bash
        run: |
          set -euo pipefail
          npx --yes esbuild src/worker.js --bundle --format=esm --platform=browser --outfile=/tmp/worker.mjs >/dev/null
          node --check public/v36-features.js
          node --check public/legacy/core-v36.js
          python3 - <<'PY'
          import re,pathlib,subprocess
          for fn in ['frontend/index.html','public/index.html']:
            s=pathlib.Path(fn).read_text()
            arr=re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',s,re.I)
            for i,x in enumerate(arr):
              p=pathlib.Path('/tmp')/f'{pathlib.Path(fn).name}-{i}.js';p.write_text(x)
              subprocess.check_call(['node','--check',str(p)],stdout=subprocess.DEVNULL)
            assert 'async function callAI(contents,opts={})' in s
            assert 'callGemini=(contents,opts={})=>callAI(contents,opts)' in s
            assert 'KOSIF_WORKSPACE_V36_2026_08_17' in s
          print('rendered client validation OK')
          PY
          grep -q 'attachmentsUsed' src/kosif-workspace.js
          grep -q 'inline_data' src/kosif-workspace.js
          grep -q 'input_file' src/kosif-workspace.js
          grep -q "type:'document'" src/kosif-workspace.js
      - name: Commit AI bridge
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/kosif-workspace.js frontend/index.html public/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Restore structured multimodal AI evidence flow in v36'
          git push origin HEAD:v36-consolidated
