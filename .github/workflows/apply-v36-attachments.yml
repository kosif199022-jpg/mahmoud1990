name: Apply Kosif v36.2 Attachment Upgrade

on:
  push:
    branches: [v36-attachments-upgrade]
    paths: ['.github/workflows/apply-v36-attachments.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v36-attachments-upgrade
          fetch-depth: 0
      - name: Apply reviewed attachment upgrade
        run: |
          python3 scripts/apply-v36-2-upgrade.py
          python3 scripts/fix-v36-2-pro.py
      - name: Validate all JavaScript and browser payloads
        run: npm run check
      - name: Run deep audit
        run: node scripts/deep-audit-v36.mjs
      - name: Bundle Worker
        run: npx --yes esbuild src/worker.js --bundle --format=esm --platform=browser --outfile=/tmp/worker.mjs >/dev/null
      - name: Commit verified application code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- .github/workflows/deep-audit-v36.yml .github/workflows/verify-v36-1-deep.yml
          git rm scripts/apply-v36-2-upgrade.py scripts/fix-v36-2-pro.py
          git add package.json src/worker.js src/professional-upgrade.js public/index.html frontend/index.html public/sw.js public/v36-features.js public/v36-operations.js scripts/deep-audit-v36.mjs
          git commit -m 'Upgrade Kosif v36.2 from reviewed attachments'
          git pull --rebase origin v36-attachments-upgrade
          git push origin HEAD:v36-attachments-upgrade
