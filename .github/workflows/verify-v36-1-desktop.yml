name: Verify Kosif v36.4 Desktop Navigation

on:
  push:
    branches: [main]
    paths:
      - 'public/index.html'
      - 'public/v36.css'
      - 'public/v36-continuity.css'
      - 'public/v36-ai-gate.js'
      - 'public/v36-zai.js'
      - 'public/sw.js'
      - 'src/worker.js'
      - 'src/security-edge.js'
      - 'src/suite-edge.js'
      - 'package.json'
      - 'RELEASE_MANIFEST_V36_4.json'
      - '.github/workflows/verify-v36-1-desktop.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/index.html'
      - 'public/v36.css'
      - 'public/v36-continuity.css'
      - 'public/v36-ai-gate.js'
      - 'public/v36-zai.js'
      - 'public/sw.js'
      - 'src/worker.js'
      - 'src/security-edge.js'
      - 'src/suite-edge.js'
      - 'package.json'
      - 'RELEASE_MANIFEST_V36_4.json'
      - '.github/workflows/verify-v36-1-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-kosif-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.54.2 >/dev/null
          npx playwright install chromium >/dev/null
      - name: Start local Worker
        shell: bash
        run: |
          nohup npx --yes wrangler@4 dev --local --port 8788 >/tmp/wrangler-desktop.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8788/__health >/tmp/health-desktop.json 2>/dev/null && exit 0
            sleep 1
          done
          cat /tmp/wrangler-desktop.log
          exit 1
      - name: Verify desktop choice list and navigation
        shell: bash
        run: |
          cat > /tmp/desktop-probe.cjs <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const fs=require('fs');
          const ok=(v,m)=>{if(!v)throw Error(m)};
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const expectedGateVersion=String(pkg.version||'');
          const expectedRelease='v'+expectedGateVersion.split('.').slice(0,2).join('.');
          const widths=[1024,1366,1920];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const width of widths){
              const context=await browser.newContext({viewport:{width,height:800}});
              const page=await context.newPage();
              await page.goto(`http://127.0.0.1:8788/audit/?desktop=${width}&release=${expectedRelease}`,{waitUntil:'domcontentloaded'});
              await page.waitForSelector('body.kosif-ready',{timeout:15000});
              await page.waitForTimeout(500);
              const metrics=await page.evaluate(()=>{
                const rect=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom}};
                const tabs=[...document.querySelectorAll('#tabbar .tab')];
                const rows=[...new Set(tabs.map(e=>Math.round(e.getBoundingClientRect().top)))];
                const overlaps=[];
                for(let i=0;i<tabs.length;i++)for(let j=i+1;j<tabs.length;j++){
                  const a=tabs[i].getBoundingClientRect(),b=tabs[j].getBoundingClientRect();
                  const hit=a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top;
                  if(hit)overlaps.push([i,j]);
                }
                const nav=document.querySelector('.tabs'),bottom=document.querySelector('#kosif-bottom-nav');
                return {
                  vw:innerWidth,body:document.body.scrollWidth,
                  main:rect(document.querySelector('main')),tabsBox:rect(document.querySelector('.tabs-inner')),
                  tabCount:tabs.length,rows:rows.length,overlaps,
                  minTabWidth:tabs.length?Math.min(...tabs.map(e=>e.getBoundingClientRect().width)):0,
                  navDisplay:nav?getComputedStyle(nav).display:'missing',
                  bottomDisplay:bottom?getComputedStyle(bottom).display:'missing',
                  gateVersion:window.KosifAIGate?.version||null,
                  zaiReady:window.KosifZAI?.provider==='zai'&&document.documentElement.dataset.kosifZai==='ready'
                };
              });
              console.log('DESKTOP_METRICS',width,metrics);
              ok(metrics.main&&metrics.main.width>=width*.9,`main constrained at ${width}`);
              ok(metrics.tabsBox&&metrics.tabsBox.width>=width*.9,`tabs constrained at ${width}`);
              ok(metrics.body<=width+1,`horizontal overflow at ${width}`);
              ok(metrics.tabCount===22,`expected 22 choices (12 core + 10 v38), got ${metrics.tabCount}`);
              ok(metrics.overlaps.length===0,`choice buttons overlap at ${width}`);
              ok(metrics.minTabWidth>=70,`choice buttons too narrow at ${width}`);
              ok(metrics.navDisplay!=='none'&&metrics.navDisplay!=='missing',`desktop tab list hidden at ${width}`);
              ok(metrics.bottomDisplay==='none'||metrics.bottomDisplay==='missing',`mobile bottom nav visible at ${width}`);
              ok(metrics.gateVersion===expectedGateVersion,`AI gate version mismatch: expected ${expectedGateVersion}, got ${metrics.gateVersion}`);
              ok(metrics.zaiReady,'Z.ai bridge not loaded');
              ok(metrics.rows>=1&&metrics.rows<=4,`unexpected choice-list row count at ${width}: ${metrics.rows}`);
              const labels=await page.locator('#tabbar .tab').allTextContents();
              ok(labels.every(x=>x.trim().length>0),'empty choice label');
              for(const tab of await page.locator('#tabbar .tab').all()){
                const go=await tab.getAttribute('data-go');
                await tab.click();await page.waitForTimeout(40);
                ok(await page.locator(`#view-${go}.show`).count()===1,`navigation failed for ${go} at ${width}`);
              }
              await page.screenshot({path:`kosif-v36-4-desktop-${width}.png`,fullPage:true});
              await context.close();
            }
            await browser.close();
            console.log('KOSIF_DESKTOP_NAV_OK',expectedRelease,expectedGateVersion);
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node /tmp/desktop-probe.cjs
      - name: Upload desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kosif-v36-4-desktop-navigation
          path: |
            kosif-v36-4-desktop-1024.png
            kosif-v36-4-desktop-1366.png
            kosif-v36-4-desktop-1920.png
            /tmp/wrangler-desktop.log
          if-no-files-found: ignore
