name: Verify Kosif v36.1 Desktop Fullscreen

on:
  push:
    branches: [main]
    paths:
      - 'public/v36-ai-gate.js'
      - '.github/workflows/verify-v36-1-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.54.2 >/dev/null
          npx playwright install chromium >/dev/null
      - name: Start local Worker
        shell: bash
        run: |
          nohup npx --yes wrangler@4 dev --local --port 8788 >/tmp/wrangler-desktop.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8788/__health >/tmp/health-desktop.json 2>/dev/null && exit 0
            sleep 1
          done
          cat /tmp/wrangler-desktop.log
          exit 1
      - name: Verify 1366x768 desktop fills viewport
        shell: bash
        run: |
          cat > /tmp/desktop-probe.cjs <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const ok=(v,m)=>{if(!v)throw Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1366,height:768}});
            const page=await context.newPage();
            await page.goto('http://127.0.0.1:8788/?desktop=1366',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(1800);
            const metrics=await page.evaluate(()=>{
              const box=s=>{const e=document.querySelector(s);if(!e)return null;const r=e.getBoundingClientRect();return {x:r.x,width:r.width,right:r.right}};
              return {vw:innerWidth,main:box('main'),top:box('.topbar-inner'),tabs:box('.tabs-inner'),body:document.body.scrollWidth,gateVersion:window.KosifAIGate?.version||null};
            });
            console.log('DESKTOP_METRICS',metrics);
            ok(metrics.main&&metrics.main.width>=1260,'main is still constrained on 1366px desktop');
            ok(metrics.top&&metrics.top.width>=1260,'topbar inner is still constrained');
            ok(metrics.tabs&&metrics.tabs.width>=1260,'tabs are still constrained');
            ok(metrics.body<=1366,'desktop layout causes horizontal overflow');
            ok(metrics.gateVersion==='36.1.1','updated desktop runtime not loaded');
            await page.screenshot({path:'kosif-v36-1-desktop-1366.png',fullPage:true});
            await browser.close();
            console.log('KOSIF_V36_1_DESKTOP_FULLSCREEN_OK');
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node /tmp/desktop-probe.cjs
      - name: Upload desktop screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kosif-v36-1-desktop-1366
          path: |
            kosif-v36-1-desktop-1366.png
            /tmp/wrangler-desktop.log
          if-no-files-found: ignore
