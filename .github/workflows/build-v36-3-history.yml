name: Build Kosif v36.3 Historical Continuity

on:
  push:
    branches: [v36-3-history-continuity]
    paths: ['.github/workflows/build-v36-3-history.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v36-3-history-continuity
      - name: Apply v36.3 patch
        run: python3 scripts/apply-v36-3-history.py
      - name: Syntax
        run: npm run syntax
      - name: Payloads
        run: npm run payloads
      - name: Legacy regressions
        run: npm run legacy-regressions
      - name: Deep audit
        run: npm run audit
      - name: Historical requirements
        run: npm run historical
      - name: Validate release files
        shell: bash
        run: |
          set -euo pipefail
          node --check public/v36-history-continuity.js
          node --check public/sw.js
          npx --yes esbuild src/worker.js --bundle --format=esm --platform=browser --outfile=/tmp/kosif-v36-3-worker.mjs >/dev/null
          cmp -s public/index.html frontend/index.html
          grep -q '/v36-history-continuity.css?v=36.3' public/index.html
          grep -q '/v36-history-continuity.js?v=36.3' public/index.html
          grep -q "version:'v36.3'" src/worker.js
          grep -q 'native-v36-3-history-continuity' src/worker.js
          grep -q 'kosif-native-v36-3-app' public/sw.js
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2 >/dev/null
          npx playwright install chromium >/dev/null
      - name: Start Worker
        shell: bash
        run: |
          nohup npx --yes wrangler@4 dev --local --port 8793 >/tmp/wrangler-v363.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8793/__health >/tmp/v363-health.json 2>/dev/null && { cat /tmp/v363-health.json; exit 0; }; sleep 1; done
          cat /tmp/wrangler-v363.log; exit 1
      - name: Mobile runtime
        shell: bash
        run: |
          cat > /tmp/v363.cjs <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright'),ok=(v,m)=>{if(!v)throw Error(m)};
          (async()=>{const b=await chromium.launch({headless:true}),c=await b.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true}),p=await c.newPage(),errors=[],bad=[];p.on('pageerror',e=>errors.push(String(e)));p.on('response',r=>{const u=new URL(r.url());if(r.status()>=400&&!u.pathname.startsWith('/api/'))bad.push(r.status()+' '+u.pathname)});let r=await p.request.get('http://127.0.0.1:8793/__health'),h=await r.json();ok(h.version==='v36.3','health');await p.goto('http://127.0.0.1:8793/?v=36.3',{waitUntil:'domcontentloaded'});await p.waitForTimeout(1600);ok(await p.evaluate(()=>!!window.KosifHistoryContinuity),'module');await p.evaluate(()=>KosifHistoryContinuity.openMore());const more=await p.locator('#kosif-more-sheet').innerText();for(const t of ['الشركات','الخريطة المعيارية','التحليلات','المطالبات','التقارير والمخرجات','ملاحظات المراجع','مكتبة المعايير','الكتب والمراجع','المصادر الرسمية','البحث والأوامر','AI Agent','الإعدادات','المظهر وحجم الخط'])ok(more.includes(t),'More '+t);await p.keyboard.press('Escape');await p.keyboard.press('Control+K');ok(await p.locator('#kosif-command-palette.show').count()===1,'palette');await p.keyboard.press('Escape');await p.evaluate(()=>KosifHistoryContinuity.setFontScale(2));await p.waitForTimeout(100);ok(await p.evaluate(()=>getComputedStyle(document.documentElement).getPropertyValue('--kosif-user-scale').trim()==='2'),'font');ok(await p.evaluate(()=>document.documentElement.scrollWidth-innerWidth)<=4,'overflow');ok(await p.evaluate(()=>typeof KosifHistoryContinuity.structuredBrief()==='object'),'brief');await p.evaluate(()=>localStorage.setItem('kosif_session_doc_meta_v2',JSON.stringify({docs:[{name:'evidence.pdf',size:100,type:'application/pdf'}]})));await p.reload({waitUntil:'domcontentloaded'});await p.waitForTimeout(800);ok(await p.evaluate(()=>KosifHistoryContinuity.docsUnavailable()),'continuity');ok(await p.locator('#kosif-doc-warning').count()===1,'warning');ok(!bad.length,'static '+bad);ok(!errors.some(x=>/ReferenceError|TypeError|SyntaxError/.test(x)),'errors '+errors);await p.screenshot({path:'kosif-v36-3-mobile.png',fullPage:true});await b.close();console.log('KOSIF_V36_3_HISTORY_RUNTIME_OK')})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node /tmp/v363.cjs
      - name: Commit release changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html frontend/index.html public/sw.js src/worker.js package.json scripts/deep-audit-v36.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Integrate v36.3 historical requirements and evidence continuity'
          git pull --rebase origin v36-3-history-continuity
          git push origin HEAD:v36-3-history-continuity
      - name: Upload runtime
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kosif-v36-3-history-runtime
          path: |
            kosif-v36-3-mobile.png
            /tmp/wrangler-v363.log
          if-no-files-found: ignore
