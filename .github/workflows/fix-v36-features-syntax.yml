name: Fix Kosif v36 Feature Syntax

on:
  push:
    branches: [v36-consolidated]
    paths: ['.github/workflows/fix-v36-features-syntax.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v36-consolidated
      - name: Repair acceptance template quote
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/v36-features.js');s=p.read_text()
          old=":'<div class=\"note warn\"><span>!</span><span>لم يُعتمد قرار القبول/الاستمرار بعد. لن تبدأ مراجعة حقيقية قبل استكمال البوابة.</span></div>`}"
          new=":`<div class=\"note warn\"><span>!</span><span>لم يُعتمد قرار القبول/الاستمرار بعد. لن تبدأ مراجعة حقيقية قبل استكمال البوابة.</span></div>`}"
          if old not in s: raise SystemExit('target quote not found')
          p.write_text(s.replace(old,new))
          PY
          node --check public/v36-features.js
      - name: Commit syntax fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/v36-features.js
          git commit -m 'Fix v36 native feature module syntax'
          git push origin HEAD:v36-consolidated
