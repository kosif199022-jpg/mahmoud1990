name: Diagnose KOSIF v46 CI
on:
  push:
    branches: [feat/kosif-theme-v46-proposal]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run syntax
  payloads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run payloads
  theme-v46:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run v46-theme
  visual-v45:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run visual-system-v45
  accounting-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run accounting && npm run audit
  v37:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run v37-engine && npm run v37-root && npm run libraries-sales
  v38:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run v38-suite
  book-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run book-engine
  v40:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run v40-experience
  v41:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run v41-experience
  kitab-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run kitab-theme
  v42:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run v42-requirements
  v43:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run v43-requirements
  design-v44:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run design-quality-v44
  enterprise-direct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run enterprise-contract && npm run direct-books-v45
  legacy-middle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run source-export-integrity && npm run legacy-regressions && npm run contract && npm run ui-safety && npm run mobile-phase-b && npm run analytics-3d-phase-c && npm run product-polish-phase-d && npm run history-parity && npm run security-edge && npm run library-privacy && npm run executor-contract && npm run reviewer-media && npm run history-restoration && npm run feature-reachability
