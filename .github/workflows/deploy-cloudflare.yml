name: Deploy Kosif to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-kosif-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build production assets
        run: npm run build

      - name: Verify repository contract
        run: npm run check

      - name: Deploy Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKE }}
          CLOUDFLARE_ACCOUNT_ID: 9ff3d8494afab356ecbf95a2a231a6b5
        run: npx --yes wrangler@4 deploy

      - name: Verify live Kosif suite
        shell: bash
        env:
          LIVE_URL: https://mahmoud-eldesouky.kosif199022.workers.dev
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS --connect-timeout 10 --max-time 20 "$LIVE_URL/__health?deploy=$GITHUB_SHA" -o /tmp/kosif-live-health.json; then
              if node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/kosif-live-health.json','utf8'));
          const ok=h?.productName==='Kosif' &&
            h?.version==='v38.0.0-root' &&
            h?.modules?.audit==='/audit/' &&
            h?.modules?.libraries==='/libraries/' &&
            h?.modules?.wealth==='/wealth/reader.html' &&
            h?.modules?.sales==='/sales/' &&
            h?.designAuthority==='Aghnam Al-Wadi Sales Dashboard 7';
          if(!ok || !String(h?.buildId||'').includes('v38-trusted-audit-os')){ console.error('Unexpected live health',h); process.exit(2); }
          console.log('LIVE_KOSIF_OK',h.version,h.buildId);
          NODE
              then ok=1; break; fi
            fi
            sleep 4
          done
          [ "$ok" = 1 ] || { echo 'Live Kosif verification failed'; cat /tmp/kosif-live-health.json 2>/dev/null || true; exit 1; }

          for path in / /audit/ /libraries/ /libraries/reader.html /libraries/reader.js /sales/ /wealth/reader.html /wealth-library-v37.js /v38-ultimate.css /v38-ultimate.js /v38-council-v3.js /v38-evidence-graph.js /v38-source-fabric.js /demo/v38/manifest.json; do
            code=$(curl -sS -L -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "$LIVE_URL$path?deploy=$GITHUB_SHA")
            case "$code" in 200|204|301|302|307|308) ;; *) echo "Bad live route $path -> $code"; exit 1;; esac
          done

          curl -fsS --connect-timeout 10 --max-time 30 "$LIVE_URL/demo/v38/manifest.json?deploy=$GITHUB_SHA" -o /tmp/kosif-v38-demo.json
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/kosif-v38-demo.json','utf8'));
          if(d?.seed!==380019 || !d?.counts || d.counts.accounts!==1000 || d.synthetic_only!==true){
            console.error('Unexpected v38 demo manifest',d);process.exit(2);
          }
          console.log('LIVE_KOSIF_V38_DEMO_OK',d.seed,d.counts.accounts);
          NODE

          curl -fsS --connect-timeout 10 --max-time 30 "$LIVE_URL/wealth/books/library.json?deploy=$GITHUB_SHA" -o /tmp/kosif-library.json
          node - <<'NODE'
          const fs=require('fs');
          const lib=JSON.parse(fs.readFileSync('/tmp/kosif-library.json','utf8'));
          const ids=new Set((Array.isArray(lib)?lib:[]).map(x=>x.id));
          for(const id of ['mafateeh','std2025','std2018','dipifr'])if(!ids.has(id))throw new Error('Missing prepared library book '+id);
          const wealth=lib.find(x=>x.id==='mafateeh');
          if(!wealth?.embedded||!wealth?.audio)throw new Error('Mafateeh must remain embedded with audio');
          console.log('LIVE_KOSIF_LIBRARY_OK', [...ids].join(','));
          NODE

          for book in std2025 std2018 dipifr; do
            curl -fsSL --connect-timeout 10 --max-time 30 "$LIVE_URL/wealth/books/$book.json?deploy=$GITHUB_SHA" -o "/tmp/kosif-index-$book.json"
            curl -fsSL --connect-timeout 10 --max-time 30 "$LIVE_URL/wealth/books/$book/1.json?deploy=$GITHUB_SHA" -o "/tmp/kosif-chapter-$book.json"
            BOOK="$book" node - <<'NODE'
          const fs=require('fs');
          const b=process.env.BOOK;
          const expected={std2018:'b1',std2025:'b3',dipifr:'b2'};
          const idx=JSON.parse(fs.readFileSync(`/tmp/kosif-index-${b}.json`,'utf8'));
          const chapter=JSON.parse(fs.readFileSync(`/tmp/kosif-chapter-${b}.json`,'utf8'));
          if(idx?.id!==expected[b]||!Array.isArray(idx.chapters)||!idx.chapters.length)throw new Error('Bad native reader index '+b);
          if(!Array.isArray(chapter.body)||!chapter.body.length)throw new Error('Bad chapter body '+b);
          console.log('LIVE_KOSIF_BOOK_OK',b,idx.id,idx.chapters.length,chapter.no);
          NODE
          done

          curl -fsS --connect-timeout 10 --max-time 30 "$LIVE_URL/wealth-library-v37.js?deploy=$GITHUB_SHA" -o /tmp/kosif-wealth-library.js
          grep -q "__KOSIF_WEALTH_LIBRARY_ROUTER__" /tmp/kosif-wealth-library.js || { echo 'Missing Mafateeh library router'; exit 1; }
          grep -Fq "location.assign('/libraries/reader.html?book='+encodeURIComponent(id))" /tmp/kosif-wealth-library.js || { echo 'Prepared books are not routed out of Mafateeh'; exit 1; }
          if grep -Eq "window\.D\s*=|window\.CH\s*=|normalizeIndex\(|hydrate\(" /tmp/kosif-wealth-library.js; then echo 'Mafateeh router still mutates prepared book content in-process'; exit 1; fi

          curl -fsS --connect-timeout 10 --max-time 30 "$LIVE_URL/libraries/reader.js?deploy=$GITHUB_SHA" -o /tmp/kosif-prepared-reader.js
          grep -q "__KOSIF_PREPARED_READER__" /tmp/kosif-prepared-reader.js || { echo 'Missing isolated prepared-reader runtime'; exit 1; }
          grep -q "navigator.serviceWorker.getRegistrations" /tmp/kosif-prepared-reader.js || { echo 'Missing stale Safari Wealth SW cleanup'; exit 1; }
          grep -q "localStorage.removeItem('mk_lib_book')" /tmp/kosif-prepared-reader.js || { echo 'Missing legacy shared-book cleanup'; exit 1; }
          grep -q "cache.delete(req)" /tmp/kosif-prepared-reader.js || { echo 'Missing obsolete reader-shell cache cleanup'; exit 1; }
          if grep -Eq "window\.D\s*=|window\.CH\s*=" /tmp/kosif-prepared-reader.js; then echo 'Prepared reader still shares Mafateeh model globals'; exit 1; fi

          # Mafateeh stays in the original document with the lightweight library
          # router. It no longer needs D/CH declaration rewriting.
          curl -fsS --connect-timeout 10 --max-time 30 "$LIVE_URL/wealth/reader.html?book=mafateeh&deploy=$GITHUB_SHA" -o /tmp/kosif-reader-mafateeh.html
          grep -q "مفاتيح الثروة" /tmp/kosif-reader-mafateeh.html || { echo 'Original Mafateeh document missing'; exit 1; }
          grep -q "wealth-library-v37.js" /tmp/kosif-reader-mafateeh.html || { echo 'Mafateeh library router missing'; exit 1; }

          # Old prepared-book Wealth URLs must migrate at the edge before the
          # upstream Mafateeh document can run. The redirect is explicitly
          # no-store so browser/CDN HTTP caches cannot pin the obsolete route.
          for book in std2025 std2018 dipifr; do
            headers="/tmp/kosif-redirect-$book.headers"
            code=$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "$LIVE_URL/wealth/reader.html?book=$book&deploy=$GITHUB_SHA")
            [ "$code" = 302 ] || { echo "Legacy prepared URL did not redirect for $book -> $code"; cat "$headers"; exit 1; }
            tr -d '\r' < "$headers" | grep -Fqi "location: /libraries/reader.html?book=$book" || { echo "Wrong prepared-reader redirect for $book"; cat "$headers"; exit 1; }
            tr -d '\r' < "$headers" | grep -Fqi "cache-control: no-store" || { echo "Prepared redirect is cacheable for $book"; cat "$headers"; exit 1; }
            curl -fsS --connect-timeout 10 --max-time 30 "$LIVE_URL/libraries/reader.html?book=$book&deploy=$GITHUB_SHA" -o "/tmp/kosif-isolated-$book.html"
            grep -q "/libraries/reader.js" "/tmp/kosif-isolated-$book.html" || { echo "Isolated reader shell missing for $book"; exit 1; }
          done

      - name: Publish successful production verification
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_URL: https://mahmoud-eldesouky.kosif199022.workers.dev
        run: |
          set -euo pipefail
          node - <<'NODE' >/tmp/kosif-deploy-status.md
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/kosif-live-health.json','utf8'));
          const run=`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          console.log(`## Deployment status\n\n✅ **VERIFIED IN PRODUCTION**\n\n- Verified at: ${new Date().toISOString()}\n- Commit: \`${process.env.GITHUB_SHA}\`\n- Live Worker: ${process.env.LIVE_URL}\n- Product: **${h.productName||'Kosif'}**\n- Version: \`${h.version}\`\n- Build: \`${h.buildId}\`\n- Audit: \`${h.modules?.audit}\`\n- Libraries: \`${h.modules?.libraries}\`\n- Wealth Keys: \`${h.modules?.wealth}\`\n- General Sales: \`${h.modules?.sales}\`\n- Prepared reader books verified: \`std2025, std2018, dipifr\`\n- Native reader indexes + first chapter hydration: **verified live**\n- Prepared-reader boundary: **isolated under /libraries/reader.html**\n- Legacy /wealth prepared-book links: **302 no-store migration verified live**\n- Safari stale-state cleanup: **Wealth SW unregister + obsolete reader-shell cache cleanup shipped**\n- Mafateeh: **original reader retained with audio and a route-only library switcher**\n- Design authority: **${h.designAuthority}**\n- Security: \`${JSON.stringify(h.security||{})}\`\n- Workflow run: ${run}\n\nThe production verifier no longer treats mutable Mafateeh D/CH globals as the correctness boundary. Prepared standards/training books execute in a separate Kosif-owned reader, outside the /wealth/ service-worker scope and without the shared mk_lib_book selector. Old prepared-book Wealth URLs are migrated at the edge with a non-cacheable redirect, while Mafateeh remains in its original reader.`);
          NODE
          gh issue edit 55 --repo "$GITHUB_REPOSITORY" --body-file /tmp/kosif-deploy-status.md

      - name: Publish failed production verification
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat >/tmp/kosif-deploy-status.md <<EOF
          ## Deployment status

          ❌ **DEPLOYMENT OR LIVE VERIFICATION FAILED**

          - Commit: \`$GITHUB_SHA\`
          - Workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          The release was not marked verified. Review the failed step before treating the Cloudflare deployment as production-ready.
          EOF
          gh issue edit 55 --repo "$GITHUB_REPOSITORY" --body-file /tmp/kosif-deploy-status.md
