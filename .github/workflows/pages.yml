name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare standards library
        shell: bash
        run: |
          set -euo pipefail
          test -f standards/library.zip
          rm -rf standards/data
          unzip -q -o standards/library.zip 'data/*' -d standards
          test -f standards/data/library.json

          python3 - <<'PY'
          import gzip, json, os
          from pathlib import Path
          from datetime import datetime, timezone

          base = Path('standards/data')
          library = json.loads((base/'library.json').read_text(encoding='utf-8'))
          if len(library) != 3:
              raise SystemExit(f'Expected 3 books, found {len(library)}')

          records = []
          chapter_count = 0
          for meta in library:
              bid = meta['id']
              book = json.loads((base/f'{bid}.json').read_text(encoding='utf-8'))
              kind = 'official-latest' if bid == 'b3' else 'official-legacy' if bid == 'b1' else 'training'
              for ch in book.get('chapters', []):
                  p = base/bid/f"{ch['no']}.json"
                  if not p.exists():
                      raise SystemExit(f'Missing chapter: {p}')
                  doc = json.loads(p.read_text(encoding='utf-8'))
                  text = '\n'.join(str(x[1]) for x in doc.get('body', []) if isinstance(x, list) and len(x) > 1 and x[1])
                  records.append({
                      'book': bid,
                      'bookTitle': meta.get('title',''),
                      'year': meta.get('year',''),
                      'kind': kind,
                      'no': doc.get('no', ch.get('no')),
                      'title': doc.get('title', ch.get('title','')),
                      'name': doc.get('name', ch.get('name','')),
                      'pages': doc.get('pages', ch.get('pages',[])),
                      'text': text,
                  })
                  chapter_count += 1

          raw = json.dumps(records, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
          with gzip.open(base/'search-index.json.gz', 'wb', compresslevel=9) as f:
              f.write(raw)

          build = {
              'version': '2.0.0',
              'commit': os.environ.get('GITHUB_SHA',''),
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'books': len(library),
              'chapters': chapter_count,
              'searchIndexBytes': len(raw),
          }
          (base/'build-info.json').write_text(json.dumps(build, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          print(build)
          PY

          node --check standards/app.js
          node --check standards/bridge.js
          node --check standards/nav-fix.js
          node --check sw.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
