name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare standards reader
        shell: bash
        run: |
          set -euo pipefail
          if [ -f standards/library.zip ]; then
            rm -rf standards/data
            unzip -q -o standards/library.zip 'data/*' -d standards
          fi
          test -f standards/data/library.json
          python3 - <<'PY'
          from pathlib import Path
          p = Path('standards/index.html')
          s = p.read_text(encoding='utf-8')
          old = "async function jget(p){const v=await get(p);if(v==null)throw Error('missing '+p);return JSON.parse(typeof v==='string'?v:new TextDecoder().decode(v))}"
          new = "async function jget(p){const v=await get(p);if(v!=null)return JSON.parse(typeof v==='string'?v:new TextDecoder().decode(v));const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error('missing '+p);const j=await r.json();try{await put(p,JSON.stringify(j))}catch{}return j}"
          old2 = "try{if((await get('data/library.json'))){showLibrary();return}}catch{}"
          new2 = "try{await jget('data/library.json');showLibrary();return}catch{}"
          if old not in s:
              raise SystemExit('reader jget marker not found')
          if old2 not in s:
              raise SystemExit('reader bootstrap marker not found')
          s = s.replace(old, new).replace(old2, new2)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
