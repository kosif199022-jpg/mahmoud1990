name: Probe Historical Kosif Core

on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-legacy-core-v36.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe historical Cloudflare versions
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/recovered
          files=(engine.js appjs.js v5js.js tamhees-v6-patch.js)
          bases=(
            'https://2fe00bb6-mahmoud-eldesouky.kosif199022.workers.dev'
            'https://8e3b7199-mahmoud-eldesouky.kosif199022.workers.dev'
          )
          for f in "${files[@]}"; do
            ok=0
            for base in "${bases[@]}"; do
              url="$base/legacy/$f?v=20"
              code=$(curl -L -sS --max-time 25 -o "/tmp/recovered/$f.tmp" -w '%{http_code}' "$url" || true)
              bytes=$(wc -c < "/tmp/recovered/$f.tmp" 2>/dev/null || echo 0)
              echo "PROBE $f $base HTTP=$code BYTES=$bytes"
              if [ "$code" = 200 ] && [ "$bytes" -gt 50 ]; then
                mv "/tmp/recovered/$f.tmp" "/tmp/recovered/$f"
                echo "RECOVERED $f FROM $base"
                ok=1
                break
              fi
            done
            if [ "$ok" = 0 ]; then echo "NOT_RECOVERED $f"; fi
          done
          echo '--- JS syntax ---'
          for f in /tmp/recovered/*.js; do [ -f "$f" ] && { echo "CHECK $f"; node --check "$f" || true; }; done
          ls -lah /tmp/recovered || true
      - name: Inspect stable source references
        shell: bash
        run: |
          git fetch origin a1990-v35-import:a1990-v35-import --depth=1
          git show a1990-v35-import:_v35_base/worker.js > /tmp/stable-worker.js
          git show a1990-v35-import:_v35_base/app-base.html > /tmp/stable-app.html
          echo '--- legacy refs in stable worker ---'
          grep -o -n -E '.{0,120}legacy.{0,180}' /tmp/stable-worker.js | head -n 80 || true
          echo '--- legacy refs in stable app ---'
          grep -o -n -E '.{0,80}/legacy/.{0,120}' /tmp/stable-app.html | head -n 40 || true
      - name: Upload recovered core
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kosif-v36-recovered-legacy-core
          path: /tmp/recovered
          if-no-files-found: warn
