name: Import A1990 v35 base

on:
  push:
    branches: [a1990-v35-import]
    paths: [.github/workflows/import-v35-base.yml]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a1990-v35-import
          fetch-depth: 1
      - name: Download stable source bundle from version preview
        run: |
          set -euo pipefail
          base='mahmoud-eldesouky.kosif199022.workers.dev/6ff6b51050ba881059c63e74/kosif-full-source.zip'
          ok=0
          for prefix in 8e3b7199 8e3b7199f188 8e3b7199-f188; do
            url="https://${prefix}-${base}"
            echo "Trying $url"
            code=$(curl -sS -L --connect-timeout 20 --max-time 60 -o /tmp/kosif-full-source.zip -w '%{http_code}' "$url" || true)
            echo "HTTP $code"
            if [ "$code" = 200 ] && unzip -tq /tmp/kosif-full-source.zip >/dev/null 2>&1; then ok=1; break; fi
          done
          if [ "$ok" != 1 ]; then
            echo 'Could not retrieve valid source ZIP from version preview.' >&2
            exit 1
          fi
          rm -rf _v35_base
          mkdir -p _v35_base
          unzip -q /tmp/kosif-full-source.zip -d _v35_base
          echo 'Imported files:'
          find _v35_base -maxdepth 2 -type f | sort | head -100
      - name: Commit imported source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _v35_base
          if ! git diff --cached --quiet; then
            git commit -m 'Import Kosif source bundle for Native v35 [skip ci]'
            git push origin HEAD:a1990-v35-import
          fi
