name: '▶️ Gemini Invoke'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

concurrency:
  group: '${{ github.workflow }}-invoke-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: false

defaults:
  run:
    shell: 'bash'

jobs:
  invoke:
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Checkout Code'
        uses: 'actions/checkout@v4'
        with:
          persist-credentials: 'false'

      - name: 'Prepare prompt context'
        shell: 'bash'
        run: |-
          jq -n \
            --arg title "${TITLE}" \
            --arg desc "${DESCRIPTION}" \
            --arg event "${EVENT_NAME}" \
            --arg pr "${IS_PULL_REQUEST}" \
            --arg num "${ISSUE_NUMBER}" \
            --arg repo "${REPOSITORY}" \
            --arg context "${ADDITIONAL_CONTEXT}" \
            '{title: $title, description: $desc, event_name: $event, is_pull_request: $pr, issue_number: $num, repository: $repo, additional_context: $context}' > gemini-context.json
        env:
          TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          DESCRIPTION: '${{ github.event.pull_request.body || github.event.issue.body }}'
          EVENT_NAME: '${{ github.event_name }}'
          IS_PULL_REQUEST: '${{ !!github.event.pull_request }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'

      - name: 'Run Gemini CLI'
        id: 'run_gemini'
        uses: 'google-github-actions/run-gemini-cli@v0'
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
        with:
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: '0.40.0'
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: 'gemini-3-flash-preview'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-invoke'
          github_pr_number: '${{ github.event.pull_request.number }}'
          github_issue_number: '${{ github.event.issue.number }}'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 60
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "add_issue_comment",
                    "issue_read",
                    "list_issues",
                    "search_issues",
                    "pull_request_read",
                    "list_pull_requests",
                    "search_pull_requests",
                    "get_commit",
                    "get_file_contents",
                    "list_commits",
                    "search_code"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": [
                  "read_file",
                  "read_many_files",
                  "glob",
                  "grep_search",
                  "list_directory"
                ]
              }
            }
          prompt: |-
            You are the read-only analysis and planning agent for this GitHub repository.

            First, use `read_file` to read `GEMINI.md` and `gemini-context.json`. The generated JSON file is the authoritative trigger context for this run and contains the Issue/PR title, full description, repository, issue number, and the user's latest `additional_context`.

            Never modify or include `gemini-context.json` in repository changes. This workflow is planning-only and must not create a branch, commit, Pull Request, or file modification.

            Treat `description` plus `additional_context` from `gemini-context.json` as the user's task. Inspect the repository broadly enough to answer accurately using read-only local tools.

            If GitHub Issue/PR context is additionally useful, the registered MCP read tools use names prefixed with `mcp_github_` (for example `mcp_github_issue_read`, `mcp_github_get_file_contents`, and `mcp_github_pull_request_read`). Do not call unregistered aliases such as `github:issue_read` or plain `issue_read`.

            Return your substantive response as the final Gemini response so the workflow can publish it back to the Issue. Do not rely on an MCP comment as the only output.

            When the request asks for a development plan or repository audit, the final response must begin exactly with:
            ## AI Assistant: Plan of Action

            For a broad application review, produce a concrete repository-grounded plan rather than a generic checklist. Include discovered architecture/components, evidence-backed findings and risks, Critical/High/Medium/Low priorities where supported, UI/UX and responsive/mobile concerns, accessibility, performance, security/privacy, domain/accounting/audit workflows, likely files/areas to change, phased PR strategy, tests/acceptance criteria, rollback strategy, and useful product improvements. Clearly distinguish verified findings from items that still require runtime/manual verification.

            Stop after the analysis/plan and wait for explicit approval.

      - name: 'Publish Gemini response'
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          GEMINI_RESPONSE: '${{ steps.run_gemini.outputs.summary }}'
          GEMINI_ERROR: '${{ steps.run_gemini.outputs.error }}'
          GEMINI_OUTCOME: '${{ steps.run_gemini.outcome }}'
        run: |-
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "${tmp}"' EXIT
          if [[ "${GEMINI_OUTCOME}" == "success" && -n "${GEMINI_RESPONSE//[[:space:]]/}" ]]; then
            python - <<'PY' > "${tmp}"
          import os
          text = os.environ.get('GEMINI_RESPONSE', '').strip()
          limit = 58000
          if len(text) > limit:
              text = text[:limit] + '\n\n---\n_Response truncated by workflow to stay within GitHub comment limits._'
          print(text)
          PY
          elif [[ "${GEMINI_OUTCOME}" == "success" ]]; then
            cat > "${tmp}" <<'EOF'
          ⚠️ Gemini CLI completed successfully, but its public summary was empty. Do not approve implementation until a visible plan is posted in this issue.
          EOF
          else
            cat > "${tmp}" <<'EOF'
          ❌ Gemini CLI did not complete successfully. Check the linked Actions run before retrying or approving any implementation.
          EOF
          fi
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body-file "${tmp}"
