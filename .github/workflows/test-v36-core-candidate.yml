name: Test Kosif v36 Core Candidate

on:
  push:
    branches: [v36-consolidated]
    paths:
      - 'public/index.html'
      - 'frontend/index.html'
      - 'public/legacy/core-v36.js'
      - '.github/workflows/test-v36-core-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v36-consolidated
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.54.2 >/dev/null
          npx playwright install chromium >/dev/null
      - name: Start static candidate
        shell: bash
        run: |
          python3 -m http.server 8788 -d public >/tmp/http.log 2>&1 &
          echo $! >/tmp/http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:8788/ >/dev/null && exit 0; sleep .25; done
          cat /tmp/http.log; exit 1
      - name: Exercise deterministic app core
        shell: bash
        run: |
          cat > probe.cjs <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const errors=[],bad=[];
            p.on('pageerror',e=>errors.push(String(e.stack||e.message)));
            p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            p.on('response',r=>{if(r.status()>=400)bad.push(r.status()+' '+new URL(r.url()).pathname)});
            await p.goto('http://127.0.0.1:8788/?candidate=v36',{waitUntil:'domcontentloaded'});
            await p.waitForTimeout(3200);
            console.log('READY',await p.locator('body').getAttribute('class'));
            console.log('BOOT',await p.locator('#kosif-boot').count());
            const funcs=await p.evaluate(()=>Object.fromEntries(['go','refreshAll','renderOutputs','callGemini','fileToParts','runNextRound','renderMap','applyDemo'].map(k=>[k,typeof globalThis[k]])));
            console.log('FUNCS',JSON.stringify(funcs));
            for(const [k,v] of Object.entries(funcs)) if(v!=='function') throw new Error('missing function '+k+'='+v);
            const demo=p.locator('#btn-demo-full');
            if(!await demo.count()) throw new Error('missing demo button');
            await demo.click(); await p.waitForTimeout(900);
            const rows=await p.locator('#tb-body tr').count(); console.log('TB_ROWS',rows);
            if(rows<10) throw new Error('demo did not populate TB');
            const views=[];
            for(const [label,expected] of [['الرئيسية','view-overview'],['الميزان','view-tb'],['الجولات','view-rounds'],['المطالبات','view-pbc']]){
              const btn=p.locator('#kosif-bottom-nav button').filter({hasText:label}).first();
              if(!await btn.count()) throw new Error('missing nav '+label);
              await btn.click(); await p.waitForTimeout(350);
              const visible=await p.locator('section[data-view].show').evaluateAll(es=>es.map(e=>e.id));
              console.log('NAV',label,JSON.stringify(visible)); views.push(...visible);
              if(!visible.includes(expected)) throw new Error(label+' did not open '+expected);
            }
            await p.evaluate(()=>go('map')); await p.waitForTimeout(250);
            if(!await p.locator('#view-map').evaluate(el=>el.classList.contains('show'))) throw new Error('map not visible');
            await p.evaluate(()=>go('outputs')); await p.waitForTimeout(250);
            if(!await p.locator('#view-outputs').evaluate(el=>el.classList.contains('show'))) throw new Error('outputs not visible');
            console.log('ERRORS',JSON.stringify(errors));
            console.log('HTTP_BAD',JSON.stringify([...new Set(bad)]));
            if(bad.length) throw new Error('HTTP errors: '+bad.join(','));
            if(errors.some(x=>/ReferenceError|TypeError|SyntaxError|Kosif boot error/i.test(x))) throw new Error(errors.join('\n'));
            await b.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node probe.cjs
