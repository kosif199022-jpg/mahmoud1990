name: Diagnose Kosif v36.3 Boot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/diagnose-v36-3-boot.cjs','.github/workflows/diagnose-v36-3-boot.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --package-lock=false playwright@1.54.2 >/dev/null && npx playwright install chromium >/dev/null
      - run: nohup npx wrangler@4 dev --local --port 8787 >/tmp/w.log 2>&1 & for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/__health >/dev/null 2>&1 && break; sleep 1; done
      - env:
          KOSIF_TEST_URL: http://127.0.0.1:8787
        run: node scripts/diagnose-v36-3-boot.cjs
