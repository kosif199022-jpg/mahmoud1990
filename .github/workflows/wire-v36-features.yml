name: Wire Kosif v36 Native Features

on:
  push:
    branches: [v36-consolidated]
    paths: ['.github/workflows/wire-v36-features.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v36-consolidated
      - name: Add core compatibility sentinels and v36 feature module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for fn in ['frontend/index.html','public/index.html']:
            p=Path(fn);s=p.read_text(encoding='utf8')
            core='<script src="/legacy/core-v36.js?v=36"></script>'
            compat='<span id="kosif-core-compat" class="pill" hidden><span id="api-dot" class="dot off"></span><span id="api-txt">Core compatibility</span></span>'
            if compat not in s:s=s.replace(core,compat+'\n'+core)
            feat='<script src="/v36-features.js?v=36"></script>'
            if feat not in s:s=s.replace(core,core+'\n'+feat)
            p.write_text(s,encoding='utf8')
          PY
      - name: Syntax and reference validation
        shell: bash
        run: |
          node --check public/legacy/core-v36.js
          node --check public/v36-features.js
          python3 - <<'PY'
          import re,os,pathlib
          s=pathlib.Path('public/index.html').read_text()
          refs=re.findall(r'<(?:script|link)\b[^>]*(?:src|href)=["\']([^"\']+)',s,re.I)
          missing=[]
          for u in refs:
            if not u.startswith('/'):continue
            clean=u.split('?')[0].split('#')[0]
            if clean=='/' or clean.startswith('/api/'):continue
            if not os.path.exists('public'+clean):missing.append(clean)
          print('MISSING',missing);assert not missing
          PY
      - name: Commit wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/index.html public/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Wire native v36 audit feature layer'
          git push origin HEAD:v36-consolidated
