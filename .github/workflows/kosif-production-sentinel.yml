name: KOSIF Production Sentinel

on:
  workflow_run:
    workflows: ["Deploy Kosif to Cloudflare"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: kosif-production-sentinel
  cancel-in-progress: false

jobs:
  verify-and-rollback:
    runs-on: ubuntu-latest
    env:
      LIVE_URL: https://mahmoud-eldesouky.kosif199022.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKE }}
      CLOUDFLARE_ACCOUNT_ID: 9ff3d8494afab356ecbf95a2a231a6b5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Classify upstream deployment outcome
        id: classify
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID/jobs?per_page=100" > /tmp/upstream-jobs.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/upstream-jobs.json','utf8'));
          const jobs=Array.isArray(raw)?raw.flatMap(x=>x.jobs||[]):(raw.jobs||[]);
          const steps=jobs.flatMap(j=>(j.steps||[]).map(s=>({job:j.name,...s})));
          const deploy=steps.find(s=>s.name==='Deploy Worker and assets');
          const verify=steps.find(s=>s.name==='Verify live Kosif suite');
          const rollbackNeeded=deploy?.conclusion==='success' && verify?.conclusion==='failure';
          const out=process.env.GITHUB_OUTPUT;
          fs.appendFileSync(out,`rollback_needed=${rollbackNeeded?'true':'false'}\n`);
          fs.appendFileSync(out,`deploy_conclusion=${deploy?.conclusion||'missing'}\n`);
          fs.appendFileSync(out,`verify_conclusion=${verify?.conclusion||'missing'}\n`);
          console.log({rollbackNeeded,deploy:deploy?.conclusion,verify:verify?.conclusion});
          NODE

      - name: Independent production smoke
        id: smoke
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
        shell: bash
        run: |
          set -euo pipefail
          for path in / /__health /audit/ /libraries/ /sales/ /wealth/reader.html; do
            code=$(curl -sS -L -o /tmp/kosif-smoke-body -w '%{http_code}' --connect-timeout 10 --max-time 30 "$LIVE_URL$path?sentinel=$GITHUB_RUN_ID")
            case "$code" in 200|204|301|302|307|308) ;; *) echo "Production smoke failed: $path -> $code"; exit 1;; esac
          done
          curl -fsS --connect-timeout 10 --max-time 30 "$LIVE_URL/__health?sentinel=$GITHUB_RUN_ID" -o /tmp/kosif-health.json
          node - <<'NODE'
          const fs=require('fs');const h=JSON.parse(fs.readFileSync('/tmp/kosif-health.json','utf8'));
          if(h?.productName!=='Kosif') throw new Error('Unexpected productName in production health');
          console.log('PRODUCTION_SENTINEL_OK',h.version,h.buildId);
          NODE

      - name: Find previous stable Worker version
        id: previous
        if: steps.classify.outputs.rollback_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Cloudflare token unavailable; refusing unsafe rollback guess'; exit 1; }
          npx --yes wrangler@4 deployments list --json > /tmp/kosif-deployments.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/kosif-deployments.json','utf8'));
          const ds=Array.isArray(raw)?raw:(raw.deployments||raw.result?.deployments||[]);
          if(ds.length<2) throw new Error('No previous deployment available for rollback');
          const prior=ds[1];
          const versions=[...(prior.versions||[])].sort((a,b)=>(b.percentage||0)-(a.percentage||0));
          const id=versions[0]?.version_id || prior.version_id;
          if(!id) throw new Error('Previous deployment did not expose a version id');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`version_id=${id}\n`);
          console.log('Previous stable version selected:',id);
          NODE

      - name: Roll back failed production deployment
        id: rollback
        if: steps.classify.outputs.rollback_needed == 'true' && steps.previous.outputs.version_id != ''
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 rollback "${{ steps.previous.outputs.version_id }}" --message "KOSIF automatic rollback after failed production verification; upstream run ${{ github.event.workflow_run.id }}"

      - name: Verify rollback
        if: steps.rollback.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS --connect-timeout 10 --max-time 30 "$LIVE_URL/__health?rollback=$GITHUB_RUN_ID" -o /tmp/kosif-rollback-health.json; then
              if node - <<'NODE'
          const fs=require('fs');const h=JSON.parse(fs.readFileSync('/tmp/kosif-rollback-health.json','utf8'));
          if(h?.productName!=='Kosif')process.exit(2);
          console.log('ROLLBACK_VERIFIED',h.version,h.buildId);
          NODE
              then ok=1; break; fi
            fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo 'Rollback health verification failed'; exit 1; }

      - name: Publish sentinel incident note
        if: steps.rollback.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 55 --repo "$GITHUB_REPOSITORY" --body "🚨 **KOSIF Production Sentinel** automatically rolled back a deployment after the deploy step succeeded but production verification failed. Upstream run: ${{ github.event.workflow_run.html_url }}. Rollback target: \`${{ steps.previous.outputs.version_id }}\`. Post-rollback health verification passed."
