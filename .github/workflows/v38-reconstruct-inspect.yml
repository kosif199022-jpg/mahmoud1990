name: Inspect v38 reconstruction payload

on:
  push:
    branches:
      - codex/kosif-v38-trusted-audit-os
    paths:
      - '.v38-import/**'
      - '.github/workflows/v38-reconstruct-inspect.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.v38-import/**'
      - '.github/workflows/v38-reconstruct-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and inspect payload
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          chunks=(.v38-import/chunk-*.b64)
          if [ ${#chunks[@]} -eq 0 ]; then
            echo 'No staged v38 reconstruction chunks; nothing to inspect.'
            exit 0
          fi
          if [ ! -f .v38-import/READY ]; then
            echo "Staged reconstruction payload is intentionally incomplete (${#chunks[@]} chunk(s)); waiting for .v38-import/READY."
            exit 0
          fi
          cat "${chunks[@]}" | tr -d '\n\r ' > /tmp/v38.b64
          base64 -d /tmp/v38.b64 > /tmp/v38.gz
          gzip -t /tmp/v38.gz
          gzip -dc /tmp/v38.gz > /tmp/v38.payload
          echo "B64_BYTES=$(wc -c < /tmp/v38.b64)"
          echo "GZIP_BYTES=$(wc -c < /tmp/v38.gz)"
          echo "PAYLOAD_BYTES=$(wc -c < /tmp/v38.payload)"
          file /tmp/v38.payload || true
          echo '--- HEX HEAD ---'
          xxd -l 96 /tmp/v38.payload || true
          echo '--- TEXT HEAD ---'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v38.payload').read_bytes()
          print(p[:4000].decode('utf-8','replace'))
          PY
          echo '--- TAR LIST (if tar) ---'
          tar -tf /tmp/v38.payload 2>/dev/null | head -120 || true
          echo '--- ZIP LIST (if zip) ---'
          unzip -l /tmp/v38.payload 2>/dev/null | head -120 || true
