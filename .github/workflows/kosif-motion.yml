name: KOSIF Motion Stack

on:
  pull_request:
    paths:
      - 'motion/**'
      - 'DESIGN.md'
      - 'config/design-tokens-v44.json'
      - 'package.json'
      - '.github/workflows/kosif-motion.yml'
  push:
    branches: [main]
    paths:
      - 'motion/**'
      - 'DESIGN.md'
      - 'config/design-tokens-v44.json'
      - 'package.json'
      - '.github/workflows/kosif-motion.yml'

permissions:
  contents: read

jobs:
  remotion:
    name: Remotion composition check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: motion/remotion/package.json
      - name: Install Remotion workspace
        run: npm install --prefix motion/remotion --no-audit --no-fund
      - name: Validate compositions
        run: npm --prefix motion/remotion run check

  hyperframes:
    name: HyperFrames lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Verify FFmpeg
        run: ffmpeg -version | head -n 1
      - name: Lint HyperFrames composition
        run: npm --prefix motion/hyperframes run lint
