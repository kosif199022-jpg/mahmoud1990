name: Apply Kosif v36.3 Root Fail Closed
on:
  push:
    branches: [main]
    paths: ['scripts/patch-v36-3-root-failclosed.mjs','.github/workflows/apply-v36-3-root-failclosed.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-kosif-v36-3-root-failclosed
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch root routing
        run: node scripts/patch-v36-3-root-failclosed.mjs
      - name: Full source gate
        run: npm run check
      - name: Commit fail-closed source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/worker.js scripts/check-v36-3-contract.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Make Kosif root fail closed against legacy shell'
          git push origin HEAD:main
