name: Apply Kosif v36.1 Deep Fixes

on:
  push:
    branches: [v36-deep-audit-fix]
    paths: ['.github/workflows/apply-v36-deep-ai-fix.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v36-deep-audit-fix
      - name: Apply reproducible UI patches
        run: |
          python3 scripts/patch-ai-v36-1.py
          python3 scripts/wire-reader-pro-v36.py
      - name: Validate AI gate and restored standards reader
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'KOSIF_CLIENT_V36_1_2026_08_17' public/index.html
          grep -q '/api/kosif/ai/test' public/index.html
          grep -q 'AI غير مختبر' public/index.html
          grep -q 'aiVerified' public/index.html
          ! grep -q 'AI Active ·' public/index.html
          grep -q 'reader-pro-v36.js?v=36.1' public/standards/index.html
          for x in speechSynthesis wakeLock mediaSession requestAnimationFrame jumpCode exportChapter setSleep; do grep -q "$x" public/standards/reader-pro-v36.js; done
          grep -q '/standards/reader-pro-v36.js' public/standards/sw.js
          node --check public/v36-ai-gate.js
          node --check public/standards/reader-pro-v36.js
          node --check public/standards/sw.js
          python3 - <<'PY'
          import re,pathlib,subprocess
          for fn in ['public/index.html','frontend/index.html','public/standards/index.html']:
            s=pathlib.Path(fn).read_text()
            for i,x in enumerate(re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',s,re.I)):
              p=pathlib.Path('/tmp')/f'{pathlib.Path(fn).name}-{i}.js'
              p.write_text(x)
              subprocess.check_call(['node','--check',str(p)],stdout=subprocess.DEVNULL)
          PY
          npx --yes esbuild src/worker.js --bundle --format=esm --platform=browser --outfile=/tmp/worker.mjs >/dev/null
      - name: Commit integrated v36.1 fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html frontend/index.html public/standards/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Integrate verified AI workflow and restored standards reader'
          git pull --rebase origin v36-deep-audit-fix
          git push origin HEAD:v36-deep-audit-fix
