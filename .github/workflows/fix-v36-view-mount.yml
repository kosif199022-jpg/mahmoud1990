name: Fix Kosif v36 Existing View Mount

on:
  push:
    branches: [v36-consolidated]
    paths: ['.github/workflows/fix-v36-view-mount.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v36-consolidated
      - name: Mount native v36 modules inside existing sections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/v36-features.js');s=p.read_text()
          old="const add=(id,html)=>{if(q('#'+id))return;const x=document.createElement('section');x.id=id;x.dataset.view=id.replace(/^view-/,'');x.innerHTML=html;main.insertBefore(x,before)};"
          new="const add=(id,html)=>{let x=q('#'+id);if(!x){x=document.createElement('section');x.id=id;x.dataset.view=id.replace(/^view-/,'');main.insertBefore(x,before)}if(x.dataset.v36Mounted!=='1'){x.insertAdjacentHTML('beforeend',html);x.dataset.v36Mounted='1'}};"
          if old not in s: raise SystemExit('ensureViews add() target not found')
          p.write_text(s.replace(old,new))
          PY
          node --check public/v36-features.js
      - name: Commit view mount repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/v36-features.js
          git commit -m 'Mount v36 features inside existing audit views'
          git pull --rebase origin v36-consolidated
          git push origin HEAD:v36-consolidated
