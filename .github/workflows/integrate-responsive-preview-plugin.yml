name: Integrate Responsive Preview Plugin
on:
  push:
    paths:
      - .github/workflows/integrate-responsive-preview-plugin.yml
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch KOSIF host and preview bridge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip

          suite = Path('src/suite-edge.js')
          text = suite.read_text()
          marker = '<script src="/responsive-preview-plugin.js?v=1" defer></script>'
          if marker not in text:
              anchor = '<script src="/suite-shell.js" defer></script>'
              if anchor not in text:
                  raise SystemExit('suite-shell injection anchor not found')
              text = text.replace(anchor, anchor + marker, 1)
              suite.write_text(text)

          packed = Path('public/preview/preview.js.gz.b64')
          js = gzip.decompress(base64.b64decode(packed.read_text().strip())).decode('utf-8')

          old_safe = '''  function safeUrl(value) {
            const v = String(value || '').trim();
            if (!v) return '../';
            if (/^(https?:\\/\\/|\\.\\.?\\/|\\/)/i.test(v)) return v;
            if (/^[\\w.-]+\\.[a-z]{2,}(\\/.*)?$/i.test(v)) return 'https://' + v;
            return v;
          }'''
          if old_safe not in js:
              old_safe = '''  function safeUrl(value) {
    const v = String(value || '').trim();
    if (!v) return '../';
    if (/^(https?:\\/\\/|\\.\\.?\\/|\\/)/i.test(v)) return v;
    if (/^[\\w.-]+\\.[a-z]{2,}(\\/.*)?$/i.test(v)) return 'https://' + v;
    return v;
  }'''
          new_safe = '''  function safeUrl(value) {
    const v = String(value || '').trim();
    if (!v) return '../';
    if (/^(https?:\\/\\/|\\.\\.?\\/|\\/)/i.test(v)) return v;
    if (/^[\\w.-]+\\.[a-z]{2,}(\\/.*)?$/i.test(v)) return 'https://' + v;
    return '../';
  }'''
          if old_safe in js:
              js = js.replace(old_safe, new_safe, 1)

          bridge_marker = 'KOSIF_RESPONSIVE_PREVIEW_BRIDGE_V1'
          if bridge_marker not in js:
              bridge = r'''
  /* KOSIF_RESPONSIVE_PREVIEW_BRIDGE_V1 */
  function serializableAuditIssues() {
    return state.lastAuditIssues.map(issue => ({
      severity: issue.severity,
      title: issue.title,
      detail: issue.detail || '',
      selector: issue.selector || ''
    }));
  }

  function emitHost(type, detail={}) {
    if (window.parent === window) return;
    window.parent.postMessage({
      source:'kosif-responsive-preview',
      type,
      detail:{ url:state.url, device:state.device, mode:state.mode, issues:serializableAuditIssues(), ...detail }
    }, location.origin);
  }

'''
              anchor = '  function auditPage() {'
              if anchor not in js:
                  raise SystemExit('auditPage anchor not found')
              js = js.replace(anchor, bridge + anchor, 1)
              js = js.replace('    renderAuditResults(doc);\n  }', "    renderAuditResults(doc);\n    emitHost('kosif:responsive-preview:audit');\n  }", 1)

              listener = r'''
  window.addEventListener('message', event => {
    if (event.origin !== location.origin) return;
    const data = event.data || {};
    if (data.source !== 'kosif-responsive-preview-host' || data.type !== 'kosif:responsive-preview:command') return;
    const payload = data.payload || {};
    if (data.command === 'run-audit') auditPage();
    else if (data.command === 'get-audit') emitHost('kosif:responsive-preview:result');
    else if (data.command === 'reload') reloadFrames();
    else if (data.command === 'set-mode' && ['single','split','matrix','fluid'].includes(payload.mode)) setMode(payload.mode);
    else if (data.command === 'set-url' && payload.url) { els.urlInput.value = safeUrl(payload.url); loadUrlFromInput(); }
    else if (data.command === 'set-device' && allDevices().some(d => d.id === payload.device)) { state.device = payload.device; const d=selectedDevice(); state.w=d.w; state.h=d.h; state.zoom=d.zoom; render(); }
  });

'''
              key_anchor = "  window.addEventListener('keydown', event => {"
              if key_anchor not in js:
                  raise SystemExit('keydown anchor not found')
              js = js.replace(key_anchor, listener + key_anchor, 1)
              js = js.replace('  render();\n})();', "  render();\n  emitHost('kosif:responsive-preview:ready', {ready:true});\n})();", 1)

          packed.write_text(base64.b64encode(gzip.compress(js.encode('utf-8'), compresslevel=9)).decode('ascii'))
          Path('/tmp/preview.js').write_text(js)
          Path('.github/workflows/integrate-responsive-preview-plugin.yml').unlink(missing_ok=True)
          PY
          node --check /tmp/preview.js
          grep -q 'responsive-preview-plugin.js' src/suite-edge.js
          grep -q 'KOSIF_RESPONSIVE_PREVIEW_BRIDGE_V1' /tmp/preview.js
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "KOSIF Integration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(plugin): wire responsive preview into KOSIF"
          git push origin HEAD:main
