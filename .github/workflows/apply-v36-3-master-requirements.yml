name: Apply Kosif v36.3 Master Requirements

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v36-3-master-requirements.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-kosif-v36-3
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply source consolidation
        run: node scripts/upgrade-v36-3-source.mjs
      - name: Run full v36.3 gate
        run: npm run check
      - name: Commit consolidated production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html frontend/index.html src/kosif-workspace.js src/worker.js public/sw.js public/standards/sw.js public/v36-ai-gate.js package.json scripts/deep-audit-v36.mjs
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'Release Kosif v36.3 source consolidation'
            git push origin HEAD:main
          fi
