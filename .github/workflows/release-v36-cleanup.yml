name: Prepare Clean Kosif v36 Production Release

on:
  push:
    branches: [v36-consolidated]
    paths: ['.github/workflows/release-v36-cleanup.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v36-consolidated
          fetch-depth: 1
      - name: Remove one-off migration and diagnostic scaffolding
        shell: bash
        run: |
          set -euo pipefail
          keep='.github/workflows/test-v36-e2e.yml .github/workflows/deep-audit-v36.yml'
          find .github/workflows -maxdepth 1 -type f -name '*.yml' | while read f; do
            case " $keep " in *" $f "*) ;; *) rm -f "$f" ;; esac
          done
          rm -f public/v36-gate-revision.txt public/v36-gate-revision-3.txt public/v36-gate-revision-4.txt
          rm -f scripts/patch-v36-ai.mjs scripts/v36-ai-backend.js.txt scripts/v36-ai-client.js.txt scripts/patch-v36-company-security.mjs scripts/v36-company-backend.js.txt scripts/v36-company-client.js.txt
      - name: Make permanent release gate run on main and candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/test-v36-e2e.yml');s=p.read_text();s=s.replace('branches: [v36-consolidated]','branches: [main, v36-consolidated]');p.write_text(s)
          p=Path('.github/workflows/deep-audit-v36.yml');s=p.read_text();s=s.replace('branches: [main]','branches: [main, v36-consolidated]');p.write_text(s)
          PY
      - name: Write v36 release manifest and README
        shell: bash
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib,datetime
          def sha(p): return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          manifest={
            'release':'Kosif v36 — Consolidated',
            'date':'2026-08-17',
            'status':'release-candidate-verified',
            'architecture':'Cloudflare Worker-first + native Static Assets + recovered deterministic audit core',
            'coreRecovery':{
              'sourceCommit':'e3d1d8b5751beb2b16a40a7e4ae08164cc858a4e',
              'sourceFormat':'self-contained packed HTML reconstructed from GitHub parts',
              'runtime':'public/legacy/core-v36.js',
              'reason':'v35 referenced four legacy JS assets that were not packaged; v36 restores the last verified self-contained deterministic engine.'
            },
            'mobileNav':['الرئيسية','الميزان','الجولات','المطالبات','المزيد'],
            'restoredAndAddedFeatures':[
              'deterministic TB engine and 110-account full demo','Excel/CSV/TXT TB import','audit rounds and final report','standards map and local standards library','PBC status center','analytics and Benford exploratory analysis','risk/assertions register','reviewer notes and voice dictation','engagement acceptance/continuance and independence gate','prior-year TB comparison','materiality revision log','journal testing (ISA 240 support)','sampling suggestion (ISA 530 support)','misstatement schedule (ISA 450 support)','working-paper templates','draft analytical financial statements','adjusted trial balance and CSV export','Word report export and audio summary','multi-agent Review Council (Gemini/OpenAI/Claude)','Claude chair/adjudication when configured','human approval/rejection register','Audit Trail export','structured multimodal evidence flow to AI','prompt-injection defense for uploaded evidence','per-device write tokens for public company changes','dark mode/mobile/font fixes','period-aware IFRS 18/19 readiness center','network-first PWA caches without API caching'
            ],
            'ai':{
              'defaultGemini':'gemini-3.6-flash','defaultOpenAI':'gpt-5.6','claudeCouncilDefault':'claude-sonnet-4-20250514','keys':'user supplied; council keys held in page memory only','evidence':'text, images and PDF/file parts retained through the backend adapters'
            },
            'standardsPolicy':{
              'SaudiPriority':'SOCPA adopted standards first for Saudi application; international standards/projects are reference/update sources until local adoption is verified.',
              'IFRS18':'effective annual reporting periods beginning on or after 2027-01-01; early application permitted',
              'IFRS19':'effective annual reporting periods beginning on or after 2027-01-01; early application permitted; optional only for eligible subsidiaries'
            },
            'security':{
              'publicCompanies':'new public companies require a per-device random write token; server stores SHA-256 only; legacy public records are read-only until explicit migration',
              'privateCompanies':'AES-GCM client-side encryption retained',
              'serviceWorker':'no API response caching'
            },
            'releaseGate':{
              'run':32019131815,'result':'success','viewport':'390x844 mobile','demoAccounts':110,'demoRounds':3,'runtimeErrors':0,'static404':0
            },
            'hashes':{p:sha(p) for p in ['frontend/index.html','public/index.html','public/legacy/core-v36.js','public/v36-features.js','public/v36-outputs.js','public/v36-governance.js','public/v36-standards-readiness.js','public/v36.css','public/sw.js','public/standards/sw.js','src/worker.js','src/kosif-workspace.js','wrangler.toml']}
          }
          pathlib.Path('RELEASE_MANIFEST_V36.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          readme='''# Kosif v36 — Consolidated\n\nمنصة مراجعة وامتثال محاسبي ذكية للسعودية، تجمع محرك مراجعة حتمي مع مكتبة المعايير والمصادر الرسمية ومجلس مراجعين متعدد النماذج.\n\n## بنية التشغيل\n- `src/worker.js`: Worker-first routing وAPI.\n- `public/index.html`: واجهة الإنتاج.\n- `public/legacy/core-v36.js`: المحرك الحتمي المستعاد من آخر حزمة ذاتية مكتملة.\n- `public/v36-features.js`: PBC/Analytics/Risks/Acceptance/Prior year/Journals/Templates/ISA 450/530.\n- `public/v36-governance.js`: مجلس المراجعين والاعتمادات وAudit Trail.\n- `public/v36-standards-readiness.js`: جاهزية IFRS 18/19 والمصادر الرسمية.\n- `public/standards/`: مكتبة المعايير المحلية القابلة للبحث.\n\n## قواعد مهنية\nKosif أداة مساعدة تحليلية، ولا تصدر رأيًا قانونيًا بدل المراجع المرخص. الحكم السعودي يعطي الأولوية للمعايير المعتمدة من SOCPA، ولا يعامل مشروعًا أو إصدارًا دوليًا مستقبليًا كمتطلب محلي نافذ قبل التحقق.\n\n## التحقق\n`Kosif v36 Comprehensive Release Gate` يشغّل فحص بناء + JavaScript + Static Assets + Playwright على شاشة جوال ويختبر العرض الكامل، الميزان، الجولات، PBC، التحليلات، الملاحظات، الحوكمة، المخرجات والوضع الليلي.\n'''
          pathlib.Path('README.md').write_text(readme)
          PY
      - name: Final static validation after cleanup
        shell: bash
        run: |
          set -euo pipefail
          for f in public/sw.js public/standards/sw.js public/standards/bridge.js public/legacy/core-v36.js public/v36-features.js public/v36-outputs.js public/v36-governance.js public/v36-standards-readiness.js; do node --check "$f"; done
          npx --yes esbuild src/worker.js --bundle --format=esm --platform=browser --outfile=/tmp/worker.mjs >/dev/null
          test -f RELEASE_MANIFEST_V36.json
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 2
      - name: Commit clean production candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare clean Kosif v36 Consolidated release'
          git pull --rebase origin v36-consolidated
          git push origin HEAD:v36-consolidated
