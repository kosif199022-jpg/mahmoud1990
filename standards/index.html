<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7659ef">
  <meta name="description" content="مكتبة معايير Kosif: قراءة وبحث ومراجع وقراءة صوتية">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css?v=2.0.0">
  <link rel="stylesheet" href="./kosif-theme.css?v=1.0.0">
  <title>مكتبة المعايير — Kosif</title>
</head>
<body>
  <header class="topbar">
    <a class="icon" href="../" aria-label="العودة إلى Kosif">←</a>
    <button class="icon" id="back" hidden aria-label="رجوع">→</button>
    <div class="crumb" id="crumb">مكتبة المعايير</div>
    <button class="icon" id="savedBtn" aria-label="المحفوظات">★</button>
    <button class="icon" id="searchBtn" aria-label="البحث">⌕</button>
    <button class="icon" id="prefsBtn" aria-label="إعدادات القراءة">Aa</button>
  </header>

  <main class="main" id="app"><div class="skeleton"></div><div class="skeleton" style="margin-top:12px"></div></main>

  <nav class="dock" id="dock" aria-label="أدوات القراءة">
    <button id="prev">السابق</button>
    <button id="note" title="حفظ النص المحدد">✎</button>
    <button class="play" id="speak">▶ قراءة</button>
    <button id="bookmark" title="علامة قراءة">★</button>
    <button id="next">التالي</button>
  </nav>

  <div class="shade" id="shade"></div>

  <section class="sheet" id="settingsSheet" aria-modal="true">
    <h3>إعدادات القراءة</h3>
    <div class="body">
      <div class="settings-row"><label>الوضع</label><button class="secondary" id="theme">نهاري / ليلي</button></div>
      <div class="settings-row"><label>حجم الخط</label><input id="fs" type="range" min="15" max="34" value="19"></div>
      <div class="settings-row"><label>تباعد السطور</label><input id="lh" type="range" min="15" max="28" value="19"></div>
      <div class="settings-row"><label>سرعة الصوت</label><input id="rate" type="range" min="0.6" max="2" step="0.1" value="1"></div>
      <div class="settings-row"><label>متابعة الفصول</label><button class="secondary" id="autoNext">تشغيل</button></div>
      <div class="offline-box">
        <b>العمل بدون إنترنت</b>
        <p class="mut tiny">حمّل الكتب والفصول على الجهاز مرة واحدة. التقدم والملاحظات تظل محفوظة محليًا.</p>
        <button class="primary" id="offlineDownload">تنزيل المكتبة كاملة</button>
        <div class="offline-progress" hidden id="offlineProgress"><i></i></div>
        <div class="mut tiny" id="offlineText" style="margin-top:7px"></div>
      </div>
      <div class="row"><button class="secondary" id="stopVoice">إيقاف الصوت</button><button class="secondary" id="resetState">مسح التقدم والملاحظات</button></div>
    </div>
  </section>

  <section class="sheet" id="searchSheet" aria-modal="true">
    <h3>البحث في المكتبة</h3>
    <div class="body">
      <input id="q" type="search" placeholder="مثال: IFRS 9، الإيراد، انخفاض القيمة…" autocomplete="off">
      <div class="tabs" id="searchTabs">
        <button class="on" data-scope="all">كل الكتب</button>
        <button data-scope="book">الكتاب الحالي</button>
        <button data-scope="chapter">الفصل الحالي</button>
      </div>
      <div class="mut tiny" id="searchStatus"></div>
      <div class="results" id="results"></div>
    </div>
  </section>

  <section class="sheet" id="savedSheet" aria-modal="true">
    <h3>المحفوظات</h3>
    <div class="body" id="savedBody"></div>
  </section>

  <div id="toast"></div>
  <script src="./app.js?v=2.0.0"></script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('../sw.js').catch(()=>{})}</script>
</body>
</html>
