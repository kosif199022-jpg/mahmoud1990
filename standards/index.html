<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16232c"><title>مكتبة المعايير — تمحيص</title><style>
:root{--bg:#f7f4ed;--paper:#fff;--ink:#172129;--mut:#66747d;--line:#dedbd2;--accent:#9a6a2b;--fs:19px;--lh:1.9}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}body.night{--bg:#0f171c;--paper:#16232c;--ink:#edf1f2;--mut:#a4b0b6;--line:#30404a;--accent:#ddb36f}button,input,select{font:inherit}button{border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}.bar{position:fixed;z-index:50;top:0;left:0;right:0;height:58px;padding:max(8px,env(safe-area-inset-top)) 10px 8px;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}.bar button,.bar a{min-width:40px;height:40px;border-radius:11px;display:grid;place-items:center;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--paper)}#crumb{flex:1;text-align:center;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{max-width:900px;margin:auto;padding:82px 18px 110px}.hero{padding:30px 4px 18px}.hero h1{font-family:Georgia,"Times New Roman",serif;font-size:30px;margin:0 0 10px}.mut{color:var(--mut);line-height:1.8}.card,.chapter,.result{display:block;width:100%;text-align:right;padding:18px;margin:10px 0;border-radius:16px;background:var(--paper);border:1px solid var(--line);box-shadow:0 4px 18px #0000000b}.card b,.chapter b{display:block;font-size:17px;line-height:1.6}.meta{font-size:12px;color:var(--mut);margin-top:7px}.pill{display:inline-block;padding:4px 9px;border-radius:99px;background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent);font-size:11px;font-weight:800}.reader header{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:25px}.reader header h1{font-family:Georgia,"Times New Roman",serif;font-size:27px;line-height:1.5}.reader header h2{font-size:17px;font-weight:500;color:var(--mut)}#prose{font-family:"Noto Naskh Arabic","Traditional Arabic",serif;font-size:var(--fs);line-height:var(--lh);text-align:justify}.ltr #prose{direction:ltr;text-align:left;font-family:Georgia,"Times New Roman",serif}#prose p{margin:0 0 1.05em;padding:4px 7px;border-radius:8px;scroll-margin-top:85px}#prose h3{font-size:1.1em;margin:1.8em 0 .8em;color:var(--accent);scroll-margin-top:85px}.anch{color:var(--accent);font-weight:800;cursor:pointer;margin-inline-end:5px}.speaking{background:color-mix(in srgb,var(--accent) 12%,transparent)!important;outline:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}::highlight(tts-word){background:#f3ca58;color:#111}.saved{background:color-mix(in srgb,#ffe15a 25%,transparent)}.dock{position:fixed;z-index:55;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:none;justify-content:center;gap:6px;background:color-mix(in srgb,var(--paper) 95%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line)}.dock.on{display:flex}.dock button{height:43px;min-width:48px;border-radius:12px}.dock .wide{min-width:82px;font-weight:800}.sheet{position:fixed;z-index:80;inset:auto 0 0;max-height:82vh;background:var(--paper);border-radius:22px 22px 0 0;border-top:1px solid var(--line);transform:translateY(105%);transition:.2s;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -20px 60px #0004}.sheet.on{transform:translateY(0)}.sheet h3{margin:0;padding:16px 18px;border-bottom:1px solid var(--line)}.sheet .body{padding:16px 18px;overflow:auto;max-height:68vh}.shade{display:none;position:fixed;z-index:70;inset:0;background:#0006}.shade.on{display:block}.row{display:flex;align-items:center;gap:12px;margin:13px 0}.row label{min-width:90px;color:var(--mut)}input[type=range]{width:100%}input[type=search]{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}.loader{max-width:640px;margin:80px auto;text-align:center;padding:26px;background:var(--paper);border:1px solid var(--line);border-radius:20px}.loader input{margin:16px 0}.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--accent)}#toast{position:fixed;z-index:100;left:50%;bottom:88px;transform:translate(-50%,20px);background:#111;color:#fff;padding:9px 15px;border-radius:99px;opacity:0;transition:.2s;font-size:13px;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}@media(max-width:600px){.main{padding-inline:12px}.reader header h1{font-size:23px}.dock button{min-width:42px}.dock .wide{min-width:70px}}
</style></head><body><div class="bar"><a href="../" title="تمحيص">←</a><button id="back" hidden>→</button><div id="crumb">مكتبة المعايير</div><button id="find" hidden>⌕</button><button id="prefs">Aa</button></div><main class="main" id="app"></main><div class="dock" id="dock"><button id="prev">السابق</button><button id="note" title="حفظ التحديد">✎</button><button class="wide" id="speak">▶ قراءة</button><button id="bookmark" title="علامة">★</button><button id="next">التالي</button></div><div class="shade" id="shade"></div><section class="sheet" id="settings"><h3>إعدادات القراءة</h3><div class="body"><div class="row"><label>الوضع</label><button id="theme">نهاري / ليلي</button></div><div class="row"><label>حجم الخط</label><input id="fs" type="range" min="15" max="34" value="19"></div><div class="row"><label>تباعد</label><input id="lh" type="range" min="15" max="28" value="19"></div><div class="row"><label>سرعة الصوت</label><input id="rate" type="range" min="0.6" max="2" step="0.1" value="1"></div><div class="row"><button id="stopVoice">إيقاف الصوت</button><button id="clearData">حذف المكتبة المحفوظة</button></div></div></section><section class="sheet" id="searchSheet"><h3>بحث في الكتاب</h3><div class="body"><input id="q" type="search" placeholder="اكتب كلمة أو رقم معيار…"><div class="row"><button id="inChapter">الفصل الحالي</button><button id="inBook">الكتاب كله</button></div><div id="results"></div></div></section><div id="toast"></div><script>
'use strict';const $=s=>document.querySelector(s),app=$('#app');const DB='tamhees-standards-v1',STORE='files';let LIB=null,BOOK=null,CH=null,chIndex=0,tts={playing:false,paused:false,idx:0,els:[],utter:null};const state=JSON.parse(localStorage.getItem('std_reader_state')||'{}');let prefs=Object.assign({fs:19,lh:19,night:false,rate:1},state.prefs||{});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const DIAC=/[\u064B-\u0652\u0640\u0670]/g;const norm=s=>String(s).replace(DIAC,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[ؤئ]/g,'ء').toLowerCase();function save(){state.prefs=prefs;localStorage.setItem('std_reader_state',JSON.stringify(state))}function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),1800)}function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function put(k,v){const db=await openDB();return new Promise((ok,no)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(v,k);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})}async function get(k){const db=await openDB();return new Promise((ok,no)=>{const r=db.transaction(STORE).objectStore(STORE).get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function keys(){const db=await openDB();return new Promise((ok,no)=>{const r=db.transaction(STORE).objectStore(STORE).getAllKeys();r.onsuccess=()=>ok(r.result.map(String));r.onerror=()=>no(r.error)})}async function wipe(){const db=await openDB();return new Promise((ok,no)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).clear();r.onsuccess=ok;r.onerror=()=>no(r.error)})}async function jget(p){const v=await get(p);if(v==null)throw Error('missing '+p);return JSON.parse(typeof v==='string'?v:new TextDecoder().decode(v))}
function findEOCD(v){for(let i=v.byteLength-22;i>=Math.max(0,v.byteLength-65558);i--)if(v.getUint32(i,true)===0x06054b50)return i;throw Error('ZIP غير صالح')}async function inflate(raw,method){if(method===0)return raw;if(method!==8)throw Error('ضغط ZIP غير مدعوم: '+method);const ds=new DecompressionStream('deflate-raw');return new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer())}async function importZip(buf){const v=new DataView(buf),u=new Uint8Array(buf),e=findEOCD(v),count=v.getUint16(e+10,true),cd=v.getUint32(e+16,true),dec=new TextDecoder(),items=[];let p=cd;for(let i=0;i<count;i++){if(v.getUint32(p,true)!==0x02014b50)throw Error('فهرس ZIP تالف');const method=v.getUint16(p+10,true),cs=v.getUint32(p+20,true),fn=v.getUint16(p+28,true),ex=v.getUint16(p+30,true),co=v.getUint16(p+32,true),lo=v.getUint32(p+42,true),name=dec.decode(u.slice(p+46,p+46+fn));if(/^data\/.+\.json$/.test(name))items.push({name,method,cs,lo});p+=46+fn+ex+co}if(!items.length)throw Error('لا توجد ملفات data/*.json في الحزمة');app.innerHTML=`<div class="loader"><h2>جارٍ تجهيز المكتبة</h2><p class="mut">يتم فك النصوص وحفظها على الجهاز للعمل بدون إنترنت.</p><div class="progress"><i id="imp"></i></div><p id="impTxt"></p></div>`;for(let i=0;i<items.length;i++){const x=items[i];if(v.getUint32(x.lo,true)!==0x04034b50)throw Error('ملف ZIP تالف');const fn=v.getUint16(x.lo+26,true),ex=v.getUint16(x.lo+28,true),st=x.lo+30+fn+ex,raw=u.slice(st,st+x.cs),out=await inflate(raw,x.method);await put(x.name,dec.decode(out));if(i%3===0){$('#imp').style.width=((i+1)/items.length*100).toFixed(1)+'%';$('#impTxt').textContent=`${i+1} / ${items.length}`;await new Promise(r=>setTimeout(r,0))}}LIB=null;toast('تم حفظ المكتبة');await showLibrary()}
async function bootstrap(){applyPrefs();try{if((await get('data/library.json'))){showLibrary();return}}catch{}app.innerHTML=`<div class="loader"><h1>مكتبة المعايير</h1><p class="mut">ثلاثة كتب للقراءة والبحث والاستشهاد. يحاول التطبيق تحميل حزمة <b>library.zip</b> من GitHub تلقائياً، وإن لم تكن مرفوعة يمكنك اختيار الحزمة مرة واحدة وسيحفظها المتصفح للعمل دون إنترنت.</p><div class="progress"><i id="autoP"></i></div><input id="zip" type="file" accept=".zip,application/zip"><p class="mut" id="loadMsg">لم تُحمّل المكتبة بعد.</p></div>`;$('#zip').onchange=async e=>{try{await importZip(await e.target.files[0].arrayBuffer())}catch(x){alert(x.message)}};try{const r=await fetch('library.zip',{cache:'no-store'});if(r.ok){$('#loadMsg').textContent='تم العثور على الحزمة على GitHub…';await importZip(await r.arrayBuffer())}}catch{}}
function applyPrefs(){document.body.classList.toggle('night',prefs.night);document.documentElement.style.setProperty('--fs',prefs.fs+'px');document.documentElement.style.setProperty('--lh',(prefs.lh/10).toFixed(1));$('#fs').value=prefs.fs;$('#lh').value=prefs.lh;$('#rate').value=prefs.rate;save()}function nav(reader=false){$('#dock').classList.toggle('on',reader);$('#find').hidden=!BOOK;$('#back').hidden=!BOOK}async function showLibrary(){stopSpeech();nav(false);BOOK=CH=null;$('#crumb').textContent='مكتبة المعايير';LIB=await jget('data/library.json');app.className='main';app.innerHTML=`<div class="hero"><span class="pill">تمحيص</span><h1>مكتبة المعايير</h1><p class="mut">اقرأ وابحث واستشهد بالنص الأصلي. وعند استخدامه في المراجعة، يظل أحدث مصدر رسمي هو صاحب الأولوية.</p></div>`+LIB.map(b=>`<button class="card" data-id="${b.id}"><span class="pill">${esc(b.year)}</span><b>${esc(b.title)}</b><div class="mut">${esc(b.sub)}</div><div class="meta">${b.chapters} فصل · ${Number(b.words).toLocaleString()} كلمة</div></button>`).join('');app.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>openBook(x.dataset.id))}async function openBook(id){stopSpeech();BOOK=await jget(`data/${id}.json`);CH=null;nav(false);$('#crumb').textContent=BOOK.title;app.className='main';const prog=state.progress?.[id]||{};app.innerHTML=`<div class="hero"><span class="pill">${esc(BOOK.year)}</span><h1>${esc(BOOK.title)}</h1><p class="mut">${esc(BOOK.sub)}</p></div>`+BOOK.chapters.map((c,i)=>`<button class="chapter" data-i="${i}"><b>${esc(c.title)}</b>${c.name?`<div>${esc(c.name)}</div>`:''}<div class="meta">${c.words.toLocaleString()} كلمة${prog[c.no]?' · '+prog[c.no]+'%':''}</div></button>`).join('');app.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>openChapter(+x.dataset.i))}const NUM=/^((?:\d{1,3}(?:\/\d{1,3})?)|(?:\(\s*[أ-ي\d]{1,3}\s*\))|(?:[أ-ي]\s*[\/.)]))\s+/;async function openChapter(i,anchor){stopSpeech();chIndex=i;const c=BOOK.chapters[i];CH=await jget(`data/${BOOK.id}/${c.no}.json`);nav(true);$('#crumb').textContent=`${BOOK.title} · ${c.no}`;app.className='main reader '+(BOOK.dir==='ltr'?'ltr':'');const saved=state.marks?.[BOOK.id]?.[CH.no]||[];const body=CH.body.map((b,n)=>{if(b[0]==='h')return `<h3 id="b${n}" data-i="${n}">${esc(b[1])}</h3>`;let text=esc(b[1]),m=b[1].match(NUM);if(m)text=`<span class="anch" data-ref="${esc(m[1])}">${esc(m[1])}</span>`+esc(b[1].slice(m[0].length));return `<p id="b${n}" data-i="${n}" class="${saved.includes(n)?'saved':''}">${text}</p>`}).join('');app.innerHTML=`<header><span class="pill">${esc(BOOK.year)}</span><h1>${esc(CH.title)}</h1>${CH.name?`<h2>${esc(CH.name)}</h2>`:''}<div class="meta">صفحات المصدر ${CH.pages?.join('–')||''}</div></header><article id="prose">${body}</article>`;$('#prev').disabled=i===0;$('#next').disabled=i===BOOK.chapters.length-1;app.querySelectorAll('.anch').forEach(a=>a.onclick=()=>{const s=`${CH.title}${CH.name?' «'+CH.name+'»':''} — فقرة ${a.dataset.ref}`;navigator.clipboard?.writeText(s);toast('تم نسخ المرجع')});if(anchor)setTimeout(()=>$('#b'+anchor)?.scrollIntoView({block:'center'}),60);window.scrollTo(0,state.scroll?.[BOOK.id+'_'+CH.no]||0)}
window.addEventListener('scroll',()=>{if(!CH||!BOOK)return;state.scroll=state.scroll||{};state.scroll[BOOK.id+'_'+CH.no]=scrollY;state.progress=state.progress||{};state.progress[BOOK.id]=state.progress[BOOK.id]||{};const max=document.documentElement.scrollHeight-innerHeight,p=max>50?Math.min(100,Math.round(scrollY/max*100)):0;if(p>(state.progress[BOOK.id][CH.no]||0))state.progress[BOOK.id][CH.no]=p;save()},{passive:true});
function blocks(){return [...document.querySelectorAll('#prose p,#prose h3')]}function firstVisible(){const a=blocks();let best=0,d=1e9;a.forEach((e,i)=>{const r=e.getBoundingClientRect(),x=Math.abs(r.top-90);if(r.bottom>70&&x<d){d=x;best=i}});return best}function clearVoiceMark(){document.querySelectorAll('.speaking').forEach(e=>e.classList.remove('speaking'));try{CSS.highlights.delete('tts-word')}catch{}}function rangeAt(el,start,len){const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n,off=0,sn=null,so=0,en=null,eo=0;while(n=tw.nextNode()){const end=off+n.nodeValue.length;if(sn==null&&start>=off&&start<=end){sn=n;so=Math.max(0,start-off)}if(start+len>=off&&start+len<=end){en=n;eo=Math.max(0,start+len-off);break}off=end}if(!sn)return null;if(!en){en=sn;eo=Math.min(sn.nodeValue.length,so+len)}const r=document.createRange();r.setStart(sn,Math.min(so,sn.nodeValue.length));r.setEnd(en,Math.min(eo,en.nodeValue.length));return r}function speakBlock(){if(!tts.playing||tts.idx>=tts.els.length){stopSpeech();return}clearVoiceMark();const el=tts.els[tts.idx],text=el.textContent.trim();if(!text){tts.idx++;return speakBlock()}el.classList.add('speaking');el.scrollIntoView({behavior:'smooth',block:'center'});const u=new SpeechSynthesisUtterance(text);tts.utter=u;u.lang=BOOK?.dir==='ltr'?'en-US':'ar-SA';u.rate=Number(prefs.rate)||1;u.onboundary=e=>{if(e.name==='word'&&window.Highlight&&CSS.highlights){const tail=text.slice(e.charIndex),m=tail.match(/^\S+/);const r=rangeAt(el,e.charIndex,m?m[0].length:1);if(r)CSS.highlights.set('tts-word',new Highlight(r))}};u.onend=()=>{if(tts.playing){tts.idx++;speakBlock()}};u.onerror=e=>{if(e.error!=='canceled'){toast('تعذر تشغيل الصوت');stopSpeech()}};speechSynthesis.speak(u);$('#speak').textContent='⏸ إيقاف مؤقت'}function startSpeech(){if(!('speechSynthesis'in window))return toast('الصوت غير مدعوم على هذا الجهاز');if(tts.paused){speechSynthesis.resume();tts.paused=false;$('#speak').textContent='⏸ إيقاف مؤقت';return}tts.els=bloc async function searchChapter(q){const n=norm(q),out=[];(CH?.body||[]).forEach((b,i)=>{if(norm(b[1]).includes(n))out.push({i,title:CH.title,text:b[1]})});renderResults(out.slice(0,80))}async function searchBook(q){const n=norm(q),out=[];$('#results').innerHTML='<p class="mut">جارٍ البحث…</p>';for(let i=0;i<BOOK.chapters.length;i++){const c=BOOK.chapters[i],j=await jget(`data/${BOOK.id}/${c.no}.json`);for(let k=0;k<j.body.length;k++)if(norm(j.body[k][1]).includes(n)){out.push({ci:i,i:k,title:j.title,text:j.body[k][1]});if(out.length>=100)break}if(out.length>=100)break}renderResults(out)}function renderResults(out){$('#results').innerHTML=out.length?out.map((r,i)=>`<button class="result" data-r="${i}"><b>${esc(r.title)}</b><div class="mut">${esc(r.text.slice(0,260))}</div></button>`).join(''):'<p class="mut">لا توجد نتائج.</p>';$('#results').querySelectorAll('[data-r]').forEach(x=>x.onclick=async()=>{const r=out[+x.dataset.r];closeSheets();if(r.ci!=null)await openChapter(r.ci,r.i);else $('#b'+r.i)?.scrollIntoView({behavior:'smooth',block:'center'})})}
function openSheet(id){$('#shade').classList.add('on');$(id).classList.add('on')}function closeSheets(){$('#shade').classList.remove('on');document.querySelectorAll('.sheet').forEach(x=>x.classList.remove('on'))}$('#shade').onclick=closeSheets;$('#prefs').onclick=()=>openSheet('#settings');$('#find').onclick=()=>openSheet('#searchSheet');$('#theme').onclick=()=>{prefs.night=!prefs.night;applyPrefs()};$('#fs').oninput=e=>{prefs.fs=+e.target.value;applyPrefs()};$('#lh').oninput=e=>{prefs.lh=+e.target.value;applyPrefs()};$('#rate').oninput=e=>{prefs.rate=+e.target.value;save();if(tts.playing){stopSpeech();startSpeech()}};$('#stopVoice').onclick=stopSpeech;$('#clearData').onclick=async()=>{if(confirm('حذف نسخة المكتبة المحفوظة على هذا الجهاز؟')){stopSpeech();await wipe();location.reload()}};$('#back').onclick=()=>CH?openBook(BOOK.id):showLibrary();$('#prev').onclick=()=>chIndex>0&&openChapter(chIndex-1);$('#next').onclick=()=>chIndex<BOOK.chapters.length-1&&openChapter(chIndex+1);$('#speak').onclick=toggleSpeech;$('#note').onclick=()=>{if(!CH)return;const sel=getSelection(),txt=sel?.toString().trim();if(!txt)return toast('حدّد نصًا أولاً');let n=sel.anchorNode;while(n&&n.nodeType!==1)n=n.parentNode;const p=n?.closest('[data-i]');if(!p)return;state.notes=state.notes||[];state.notes.push({book:BOOK.title,chapter:CH.title,i:+p.dataset.i,text:txt.slice(0,800),time:Date.now()});state.marks=state.marks||{};state.marks[BOOK.id]=state.marks[BOOK.id]||{};state.marks[BOOK.id][CH.no]=state.marks[BOOK.id][CH.no]||[];if(!state.marks[BOOK.id][CH.no].includes(+p.dataset.i))state.marks[BOOK.id][CH.no].push(+p.dataset.i);p.classList.add('saved');save();sel.removeAllRanges();toast('تم الحفظ')};$('#bookmark').onclick=()=>{if(!CH)return;const el=blocks()[firstVisible()];if(!el)return;state.bookmarks=state.bookmarks||[];state.bookmarks.push({book:BOOK.id,chapter:CH.no,i:+el.dataset.i,title:CH.title,time:Date.now()});save();toast('تمت إضافة العلامة')};$('#inChapter').onclick=()=>searchChapter($('#q').value.trim());$('#inBook').onclick=()=>$('#q').value.trim()&&searchBook($('#q').value.trim());$('#q').onkeydown=e=>{if(e.key==='Enter')searchBook(e.target.value.trim())};bootstrap();
</script></body></html>
